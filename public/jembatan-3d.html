<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jembatan Sirotu - Day Night FPS</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef2f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 28px);
      padding: 8px 9px;
      border-radius: 18px;
      background: rgba(8, 15, 24, .70);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 12px 36px rgba(0,0,0,.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    #brand {
      min-width: 0;
      padding: 0 7px 0 5px;
    }

    #brand h1 {
      margin: 0;
      color: #fff;
      font-size: 12px;
      line-height: 1.05;
      letter-spacing: .16em;
      font-weight: 900;
      white-space: nowrap;
    }

    #controlHint {
      margin: 4px 0 0;
      color: rgba(255,255,255,.60);
      font-size: 9px;
      white-space: nowrap;
    }

    #overlay .buttons {
      display: flex;
      gap: 6px;
      min-width: 0;
    }

    #overlay button {
      min-height: 34px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 7px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: rgba(255,255,255,.09);
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
      white-space: nowrap;
    }

    #overlay button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.18);
    }

    #overlay button.primary { background: #b91c1c; border-color: rgba(255,255,255,.06); }
    #overlay button.primary:hover { background: #991b1b; }
    #overlay button.active { background: #0f766e; }

    #fpsHud {
      position: fixed;
      inset: 0;
      z-index: 24;
      display: none;
      pointer-events: none;
      user-select: none;
    }

    #fpsHud.show { display: block; }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      opacity: .72;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,.94);
      border-radius: 999px;
      box-shadow: 0 0 3px rgba(0,0,0,.6);
    }

    #crosshair::before { width: 16px; height: 2px; }
    #crosshair::after { width: 2px; height: 16px; }

    #fpsHelp {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      max-width: calc(100vw - 28px);
      padding: 9px 13px;
      border-radius: 999px;
      color: #fff;
      background: rgba(8,15,24,.68);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    #lockHint {
      position: absolute;
      left: 50%;
      top: calc(50% + 42px);
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 999px;
      color: #fff;
      background: rgba(8,15,24,.72);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 10px;
      font-weight: 800;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #lockHint.show { opacity: 1; }

    #cycleHud {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 29;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      color: #fff;
      background: rgba(8,15,24,.60);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 28px rgba(0,0,0,.13);
      pointer-events: none;
      user-select: none;
    }

    #cycleIcon {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffd36a;
      box-shadow: 0 0 12px rgba(255,211,106,.72);
      transition: background .5s ease, box-shadow .5s ease;
    }

    #cycleHud.night #cycleIcon {
      background: #a9c7ff;
      box-shadow: 0 0 12px rgba(169,199,255,.72);
    }

    #cycleText { font-size: 9px; font-weight: 900; letter-spacing: .10em; }
    #cycleTime { font-size: 9px; color: rgba(255,255,255,.62); min-width: 32px; text-align: right; }

    #rideHud {
      position: fixed;
      right: 14px;
      top: 58px;
      z-index: 28;
      display: none;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 16px;
      color: #fff;
      background: rgba(8,15,24,.68);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0,0,0,.15);
    }

    #rideHud.show { display: block; }
    #rideHud strong { display: block; font-size: 11px; letter-spacing: .08em; }
    #rideHud span { display: block; margin-top: 4px; font-size: 9px; color: rgba(255,255,255,.62); }

    @media (max-width: 760px) {
      #overlay {
        top: auto;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vw - 18px);
        max-width: none;
        padding: 7px;
        border-radius: 16px;
      }

      #brand { display: none; }
      #overlay .buttons { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
      #overlay button { width: 100%; padding: 7px 5px; font-size: 9px; overflow: hidden; text-overflow: ellipsis; }
      #cycleHud { top: 10px; right: 10px; padding: 7px 9px; }
      #rideHud { top: 52px; right: 10px; min-width: 150px; }
      #fpsHelp { bottom: 64px; font-size: 9px; padding: 8px 10px; white-space: normal; text-align: center; }
    }

    @media (max-width: 430px) {
      #overlay button { font-size: 8px; }
      #rideHud span { display: none; }
    }
  </style>
</head>

<body>
  <div id="overlay">
    <div id="brand">
      <h1>JEMBATAN SIROTU</h1>
      <p id="controlHint">Drag putar · Scroll zoom · Klik kanan geser</p>
    </div>
    <div class="buttons">
      <button id="resetCamera">Reset</button>
      <button id="toggleExplore" class="primary">FPS</button>
      <button id="toggleRide">Ride Cam</button>
      <button id="toggleTraffic">Pause</button>
    </div>
  </div>

  <div id="fpsHud">
    <div id="crosshair"></div>
    <div id="lockHint">Klik view untuk mengunci mouse</div>
    <div id="fpsHelp">WASD bergerak · Mouse melihat · Shift sprint · Space lompat · ESC keluar</div>
  </div>

  <div id="cycleHud">
    <span id="cycleIcon"></span>
    <strong id="cycleText">SIANG</strong>
    <span id="cycleTime">00:30</span>
  </div>

  <div id="rideHud">
    <strong id="rideName">SUPERCAR</strong>
    <span>R untuk ganti kendaraan · ESC untuk keluar</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    // ============================================================
    // 1. SCENE / CAMERA / RENDERER
    // ============================================================

    const scene = new THREE.Scene();
    // Atmospheric fog is intentionally close to the horizon color so distant
    // hills fade naturally instead of ending in a hard 3D edge.
    scene.background = new THREE.Color(0xbccbd0);
    scene.fog = new THREE.FogExp2(0xb8c4c0, 0.00325);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(118, 56, 92);

    const isCompactDevice = window.matchMedia('(max-width: 760px), (pointer: coarse)').matches;
    const MAX_DPR = isCompactDevice ? 1.0 : 1.55;
    let activeDpr = Math.min(window.devicePixelRatio, MAX_DPR);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(activeDpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.4, 0);
    controls.minDistance = 48;
    controls.maxDistance = 280;
    controls.maxPolarAngle = Math.PI * 0.495;

    // Subtle cinematic post processing: enough glow for lamps/headlights and
    // bright sun reflections, without turning the bridge into a neon scene.
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(activeDpr);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.18,
      0.45,
      0.90
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // ============================================================
    // 1B. AUTOMOTIVE PBR ENVIRONMENT
    // ============================================================

    // A procedural panoramic environment gives glossy vehicle paint convincing
    // reflections without downloading a large HDRI file. Bright cloud bands,
    // horizon light and a warm sun spot read naturally across curved clearcoat.
    function makeAutomotiveEnvironment() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      const sky = ctx.createLinearGradient(0, 0, 0, c.height);
      sky.addColorStop(0.00, '#315e86');
      sky.addColorStop(0.38, '#78a9c5');
      sky.addColorStop(0.52, '#efd0aa');
      sky.addColorStop(0.62, '#7a7b70');
      sky.addColorStop(1.00, '#242a2b');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, c.width, c.height);

      // Long soft cloud/highlight bands create moving-looking clearcoat streaks
      // as the cars pass the camera.
      ctx.globalCompositeOperation = 'screen';
      const bands = [
        [95, 152, 250, 36, .24],
        [360, 128, 330, 44, .18],
        [735, 168, 220, 30, .22],
        [835, 95, 150, 25, .16]
      ];
      for (const [x,y,w,h,a] of bands) {
        const g = ctx.createRadialGradient(x+w*.5,y+h*.5,1,x+w*.5,y+h*.5,w*.52);
        g.addColorStop(0, `rgba(255,255,255,${a})`);
        g.addColorStop(.55, `rgba(235,244,248,${a*.44})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x-w*.1, y-h*2, w*1.2, h*5);
      }

      const sunG = ctx.createRadialGradient(210, 222, 3, 210, 222, 82);
      sunG.addColorStop(0, 'rgba(255,244,205,.98)');
      sunG.addColorStop(.15, 'rgba(255,206,133,.78)');
      sunG.addColorStop(.55, 'rgba(255,155,86,.16)');
      sunG.addColorStop(1, 'rgba(255,120,50,0)');
      ctx.fillStyle = sunG;
      ctx.fillRect(125, 137, 170, 170);
      ctx.globalCompositeOperation = 'source-over';

      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    const automotiveEnvironment = makeAutomotiveEnvironment();
    scene.environment = automotiveEnvironment;
    const vehiclePaintMaterials = [];

    // ============================================================
    // 2. LIGHT
    // ============================================================

    const hemiLight = new THREE.HemisphereLight(0xfff4dc, 0x536b58, 1.65);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xffe2b8, 3.15);
    sun.position.set(-95, 82, 92);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -140;
    sun.shadow.camera.right = 140;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 320;
    scene.add(sun);

    // Warm bounce light from the sky/horizon.
    const warmFill = new THREE.DirectionalLight(0xffc98d, 0.42);
    warmFill.position.set(110, 35, -120);
    scene.add(warmFill);

    const moonLight = new THREE.DirectionalLight(0xa9c8ff, 0);
    moonLight.position.set(90, 70, -90);
    scene.add(moonLight);

    // Cool fill keeps the bridge readable at night without flattening the scene.
    const nightFill = new THREE.DirectionalLight(0x70a7ff, 0);
    nightFill.position.set(-80, 38, 120);
    scene.add(nightFill);

    // ============================================================
    // 3. MATERIAL
    // ============================================================

    const steelRed = new THREE.MeshStandardMaterial({
      color: 0xf23832,
      metalness: 0.24,
      roughness: 0.42
    });

    const steelDark = new THREE.MeshStandardMaterial({
      color: 0xc72525,
      metalness: 0.32,
      roughness: 0.42
    });

    const hangerMat = new THREE.MeshStandardMaterial({
      color: 0xc5a632,
      metalness: 0.48,
      roughness: 0.36
    });

    const asphaltMat = new THREE.MeshStandardMaterial({
      color: 0x27292b,
      roughness: 0.96
    });

    const concreteMat = new THREE.MeshStandardMaterial({
      color: 0xc8c8c2,
      roughness: 0.88
    });

    const sidewalkMat = new THREE.MeshStandardMaterial({
      color: 0xe7e4dc,
      roughness: 0.86
    });

    const whitePaintMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.72
    });

    const yellowPaintMat = new THREE.MeshStandardMaterial({
      color: 0xf1cf12,
      roughness: 0.70
    });

    const railingMat = new THREE.MeshStandardMaterial({
      color: 0xe4a0a0,
      metalness: 0.18,
      roughness: 0.50
    });

    const lampMat = new THREE.MeshStandardMaterial({
      color: 0xd7ddda,
      metalness: 0.55,
      roughness: 0.34
    });

    const lampBulbMat = new THREE.MeshStandardMaterial({
      color: 0xfff2c2,
      emissive: 0xffc45c,
      emissiveIntensity: 0.0,
      roughness: 0.24
    });
    const streetLampFills = [];
    const streetLampPools = [];
    const waterLampReflections = [];
    let streetLampCounter = 0;

    function makeRadialGlowTexture(inner = 'rgba(255,230,170,.95)', mid = 'rgba(255,190,95,.24)') {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64,64,3,64,64,62);
      g.addColorStop(0, inner);
      g.addColorStop(.28, mid);
      g.addColorStop(1, 'rgba(255,170,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,128,128);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const lampPoolTex = makeRadialGlowTexture();
    const waterReflectTex = makeRadialGlowTexture('rgba(255,224,160,.85)','rgba(255,170,80,.18)');

    const bearingMat = new THREE.MeshStandardMaterial({
      color: 0x3f4449,
      metalness: 0.72,
      roughness: 0.26
    });

    const boltMat = new THREE.MeshStandardMaterial({
      color: 0x9ca3a8,
      metalness: 0.86,
      roughness: 0.20
    });

    const waterMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uNight: { value: 0 },
        uSunDir: { value: new THREE.Vector3(-0.45, 0.72, 0.52).normalize() },
        uMoonDir: { value: new THREE.Vector3(0.45, 0.72, -0.52).normalize() },
        uSky: { value: new THREE.Color(0xcad9dc) }
      },
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos;
        varying vec2 vUv2;
        varying float vWave;
        varying float vCrest;

        // Compact Gerstner-style wave. Horizontal displacement is intentionally
        // subtle so the water keeps volume instead of looking like a rubber sheet.
        float oceanWave(inout vec3 p, vec2 dir, float amp, float wavelength, float speed, float phaseOffset) {
          dir = normalize(dir);
          float k = 6.28318530718 / wavelength;
          float phase = k * dot(dir, p.xy) + uTime * speed + phaseOffset;
          float s = sin(phase);
          float c = cos(phase);
          p.xy += dir * c * amp * 0.34;
          p.z += s * amp;
          return s * amp;
        }

        void main() {
          vec3 p = position;
          float h = 0.0;

          // Six wave families: ocean swell, cross swell and short wind waves.
          h += oceanWave(p, vec2( 1.00,  0.26), 0.155, 31.0, 0.74, 0.0);
          h += oceanWave(p, vec2(-0.42,  1.00), 0.112, 23.0, 0.92, 1.7);
          h += oceanWave(p, vec2( 0.72, -0.68), 0.076, 13.5, 1.36, 3.1);
          h += oceanWave(p, vec2(-0.92, -0.22), 0.050,  8.4, 1.78, 4.2);
          h += oceanWave(p, vec2( 0.18,  1.00), 0.030,  5.0, 2.25, 2.2);
          h += oceanWave(p, vec2( 0.95,  0.55), 0.018,  3.1, 2.85, 5.4);

          vec4 world = modelMatrix * vec4(p, 1.0);
          vWorldPos = world.xyz;
          vUv2 = uv;
          vWave = h;
          vCrest = smoothstep(0.215, 0.355, h);
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uNight;
        uniform vec3 uSunDir;
        uniform vec3 uMoonDir;
        uniform vec3 uSky;
        varying vec3 vWorldPos;
        varying vec2 vUv2;
        varying float vWave;
        varying float vCrest;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        void main() {
          // Macro normal comes from the physically displaced mesh.
          vec3 dx = dFdx(vWorldPos);
          vec3 dy = dFdy(vWorldPos);
          vec3 macroN = normalize(cross(dx, dy));
          if (macroN.y < 0.0) macroN = -macroN;

          // Wind-driven capillary waves add high-frequency reflection detail
          // without requiring a normal-map image.
          float m1 = sin(vWorldPos.x * 3.8 + vWorldPos.z * 5.6 + uTime * 2.35);
          float m2 = sin(vWorldPos.x * -6.2 + vWorldPos.z * 3.4 - uTime * 1.82 + 1.7);
          float m3 = cos(vWorldPos.x * 9.7 + vWorldPos.z * -7.1 + uTime * 3.15);
          vec3 microN = normalize(vec3(
            (m1 * .18 + m2 * .11 + m3 * .055),
            1.0,
            (m2 * .17 - m1 * .09 + m3 * .045)
          ));
          vec3 n = normalize(mix(macroN, microN, 0.31));

          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          float ndv = clamp(dot(viewDir, n), 0.0, 1.0);
          float fresnel = 0.020 + 0.980 * pow(1.0 - ndv, 5.0);

          // River/ocean depth illusion: center is deeper; banks become turquoise.
          float shore = smoothstep(43.0, 63.0, abs(vWorldPos.x));
          float crestLight = smoothstep(-0.18, 0.30, vWave);

          vec3 dayDeep = vec3(0.000, 0.205, 0.315);
          vec3 dayMid  = vec3(0.010, 0.455, 0.585);
          vec3 dayShallow = vec3(0.080, 0.770, 0.750);
          vec3 nightDeep = vec3(0.010, 0.075, 0.145);
          vec3 nightMid  = vec3(0.015, 0.205, 0.330);
          vec3 nightShallow = vec3(0.035, 0.410, 0.500);

          vec3 deep = mix(dayDeep, nightDeep, uNight);
          vec3 midCol = mix(dayMid, nightMid, uNight);
          vec3 shallow = mix(dayShallow, nightShallow, uNight);
          vec3 waterBody = mix(deep, midCol, 0.36 + crestLight * 0.16);
          waterBody = mix(waterBody, shallow, shore * 0.58);

          // Looking straight down reveals body color; grazing angles reflect sky.
          vec3 reflectedSky = mix(uSky * 0.74, uSky * 1.16, fresnel);
          vec3 col = mix(waterBody, reflectedSky, fresnel * mix(0.78, 0.88, uNight));

          vec3 lightDir = normalize(mix(uSunDir, uMoonDir, uNight));
          vec3 reflected = reflect(-lightDir, n);
          float rv = max(dot(reflected, viewDir), 0.0);

          // Dual-lobe specular creates a broad wet sheen plus razor-sharp glints.
          float broadSpec = pow(rv, mix(34.0, 24.0, uNight));
          float tightSpec = pow(rv, mix(300.0, 165.0, uNight));
          vec3 specColor = mix(vec3(1.00, 0.72, 0.42), vec3(0.62, 0.80, 1.00), uNight);
          col += specColor * broadSpec * mix(0.26, 0.35, uNight);
          col += specColor * tightSpec * mix(3.4, 2.1, uNight);

          // Sun/moon glitter broken into thousands of tiny animated flashes.
          float glitterField = hash21(floor(vWorldPos.xz * 3.5) + floor(uTime * 4.0));
          float glitter = smoothstep(0.90, 0.995, glitterField) * pow(rv, 42.0);
          col += specColor * glitter * mix(1.55, 1.10, uNight);

          // Whitecaps only appear on higher, steeper crests and break up naturally.
          float foamNoise = hash21(floor(vWorldPos.xz * 1.55 + vec2(uTime * .32, -uTime * .18)));
          float streak = 0.5 + 0.5 * sin(vWorldPos.x * .82 + vWorldPos.z * .46 + uTime * 1.45);
          float foam = vCrest * smoothstep(.40, .88, foamNoise * .58 + streak * .52);
          foam += shore * smoothstep(.60, .95, hash21(floor(vWorldPos.xz * 1.1))) * .12;
          vec3 foamColor = mix(vec3(0.88, 1.00, 0.98), vec3(0.62, 0.82, 0.91), uNight);
          col = mix(col, foamColor, clamp(foam * .52, 0.0, .48));

          // Slight distance haze integrates the water into the atmospheric scene.
          float haze = smoothstep(125.0, 300.0, length(vWorldPos.xz));
          col = mix(col, uSky, haze * .18);

          // Filmic-friendly highlight compression keeps glitter bright but not blown out.
          col = col / (vec3(0.82) + col * 0.18);
          gl_FragColor = vec4(col, 0.985);
        }
      `,
      transparent: true,
      depthWrite: true
    });

    const landMat = new THREE.MeshStandardMaterial({
      color: 0x748d57,
      roughness: 1.0
    });

    const contourMat = new THREE.LineBasicMaterial({

    });

    const leafMats = [
      new THREE.MeshStandardMaterial({ color: 0x31583c, roughness: 1.0 }),

    const warmGlowMat = new THREE.MeshBasicMaterial({

    });

    // ============================================================
    // 3B. PROCEDURAL SURFACE TEXTURES (NO EXTERNAL IMAGE FILES)
    // ============================================================

    function makeNoiseTexture(baseHex, grain = 34, lineChance = 0.0) {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const base = new THREE.Color(baseHex);
      const img = ctx.createImageData(size, size);
      let seed = 9173;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const n = (rand() - 0.5) * grain;
          const streak = rand() < lineChance ? -22 : 0;
          img.data[i] = Math.max(0, Math.min(255, base.r * 255 + n + streak));
          img.data[i+1] = Math.max(0, Math.min(255, base.g * 255 + n + streak));
          img.data[i+2] = Math.max(0, Math.min(255, base.b * 255 + n + streak));
          img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    const asphaltTex = makeNoiseTexture(0x292b2d, 42, 0.0025);
    asphaltTex.repeat.set(32, 3);
    asphaltMat.map = asphaltTex;
    asphaltMat.color.set(0xffffff);
    asphaltMat.roughness = 0.91;

    const concreteTex = makeNoiseTexture(0xbfc0b9, 28, 0.0009);
    concreteTex.repeat.set(18, 4);
    concreteMat.map = concreteTex;
    concreteMat.color.set(0xffffff);

    const sidewalkTex = makeNoiseTexture(0xdedbd1, 20, 0.0005);
    sidewalkTex.repeat.set(24, 2);
    sidewalkMat.map = sidewalkTex;
    sidewalkMat.color.set(0xffffff);

    // ============================================================
    // 3C. CINEMATIC SKY DOME + CLOUDS
    // ============================================================

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTop: { value: new THREE.Color(0x6f93a8) },
        uHorizon: { value: new THREE.Color(0xe8c7a7) },
        uLower: { value: new THREE.Color(0xd8d8c5) },
        uSunDirection: { value: new THREE.Vector3(-0.46, 0.27, -0.84).normalize() }
      },
      vertexShader: `
        varying vec3 vDir;
        void main(){
          vec4 world = modelMatrix * vec4(position,1.0);
          vDir = normalize(world.xyz - cameraPosition);
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform vec3 uTop;
        uniform vec3 uHorizon;
        uniform vec3 uLower;
        uniform vec3 uSunDirection;
        varying vec3 vDir;
        void main(){
          float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
          vec3 col = mix(uLower, uHorizon, smoothstep(0.16, 0.52, h));
          col = mix(col, uTop, smoothstep(0.50, 0.92, h));
          float sunDot = max(dot(normalize(vDir), normalize(uSunDirection)), 0.0);
          float halo = pow(sunDot, 18.0) * 0.60;
          float disc = pow(sunDot, 950.0) * 5.0;
          col += vec3(1.0,0.55,0.24) * halo + vec3(1.0,0.84,0.55) * disc;
          gl_FragColor = vec4(col,1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(470, 48, 24), skyMat);
    scene.add(skyDome);

    // Matahari dan bulan bergerak mengikuti siklus 60 detik.
    const sunVisual = new THREE.Mesh(
      new THREE.SphereGeometry(6.2, 20, 14),
      new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 1 })
    );
    scene.add(sunVisual);

    const moonVisual = new THREE.Mesh(
      new THREE.SphereGeometry(4.2, 18, 12),
      new THREE.MeshBasicMaterial({ color: 0xdce8ff, transparent: true, opacity: 0 })
    );
    scene.add(moonVisual);

    const starCount = isCompactDevice ? 220 : 420;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    let starSeed = 88123;
    const starRand = () => { starSeed = (starSeed * 48271) % 2147483647; return starSeed / 2147483647; };
    for (let i = 0; i < starCount; i++) {
      const theta = starRand() * Math.PI * 2;
      const phi = Math.acos(THREE.MathUtils.lerp(0.08, 0.95, starRand()));
      const r = 390 + starRand() * 25;
      starPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
      starPos[i*3+1] = Math.cos(phi) * r;
      starPos[i*3+2] = Math.sin(phi) * Math.sin(theta) * r;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xdbeafe, size: isCompactDevice ? 0.65 : 0.82,
      transparent: true, opacity: 0, depthWrite: false, sizeAttenuation: true
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    function makeCloudTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,c.width,c.height);
      const blobs = [[78,72,55],[120,54,48],[158,73,58],[110,82,66],[190,78,38]];
      for (const [x,y,r] of blobs) {
        const g = ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,'rgba(255,247,236,.70)');
        g.addColorStop(.55,'rgba(244,236,224,.30)');
        g.addColorStop(1,'rgba(239,231,218,0)');
        ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const cloudTex = makeCloudTexture();
    const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.52, depthWrite: false, fog: true });
    const clouds = [];
    [
      [-120,58,-210,46,20],[-28,72,-235,58,25],[78,54,-220,50,22],[155,68,-188,44,18],
      [-170,48,85,38,16],[145,60,105,42,18]
    ].forEach(([x,y,z,sx,sy]) => {
      const sp = new THREE.Sprite(cloudMat.clone());
      sp.position.set(x,y,z); sp.scale.set(sx,sy,1); scene.add(sp); clouds.push(sp);
    });

    // ============================================================
    // 4. DIMENSI UTAMA
    // ============================================================

    // Koordinat model dipusatkan di tengah jembatan:
// STA 0 = x -75, STA 25 = x -50, STA 125 = x +50, STA 150 = x +75.
    const BRIDGE_LENGTH = 150;
    const DECK_WIDTH = 10;
    const DECK_Y = 0;

    const ARCH_START = -50; // STA 25 m
    const ARCH_END = 50; // STA 125 m
    const ARCH_SPRING_Y = -3.80; // diturunkan lagi
    const ARCH_RISE = 17.65; // menjaga elevasi puncak arch tetap hampir sama
    const ARCH_BASE_HALF_WIDTH = 6.05;
    const ARCH_TILT = THREE.MathUtils.degToRad(10);

    const bridge = new THREE.Group();
    scene.add(bridge);

    // ============================================================
    // 4B. SUBTLE LIVING ROAD - OTOMATIS, TANPA UI TAMBAHAN
    // ============================================================

    const pulseGroup = new THREE.Group();
    scene.add(pulseGroup);

    const pulsePool = [];
    for (let i = 0; i < 4; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffd36b,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const pulse = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.035, 6.35), mat);
      pulse.position.set(0, 0.235, 0);
      pulse.visible = false;
      pulseGroup.add(pulse);
      pulsePool.push(pulse);
    }

    function triggerBridgePulse(x, strength = 1) {
      let pulse = pulsePool[0];
      for (const candidate of pulsePool) {
        if (!candidate.visible || candidate.material.opacity < pulse.material.opacity) pulse = candidate;
      }
      pulse.position.x = THREE.MathUtils.clamp(x, -69, 69);
      pulse.scale.set(1, 1, 1);
      pulse.material.opacity = Math.min(0.48, 0.20 + strength * 0.10);
      pulse.visible = true;
    }

    function updateBridgePulse(delta) {
      for (const pulse of pulsePool) {
        if (!pulse.visible) continue;
        pulse.scale.x += delta * 12.0;
        pulse.material.opacity *= Math.pow(0.06, delta);
        if (pulse.material.opacity < 0.008) {
          pulse.material.opacity = 0;
          pulse.visible = false;
        }
      }
    }

    // Dipertahankan agar pemanggilan lama pada elemen struktur tetap aman.
    function markInspectable(mesh) { return mesh; }

    // ============================================================
    // 5. HELPER
    // ============================================================

    function addBeam(p1, p2, height, width, material, parent = bridge) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(length, height, width),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(1, 0, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinderBetween(p1, p2, radius, material, parent = bridge, segments = 10) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function archY(x) {
      const t = (x - ARCH_START) / (ARCH_END - ARCH_START);
      if (t < 0 || t > 1) return ARCH_SPRING_Y;
      return ARCH_SPRING_Y + ARCH_RISE * 4 * t * (1 - t);
    }

    function archZ(x, side) {
      const y = archY(x);
      const inward = Math.tan(ARCH_TILT) * Math.max(0, y - ARCH_SPRING_Y);
      return side * Math.max(2.95, ARCH_BASE_HALF_WIDTH - inward);
    }

    function archPoint(x, side) {
      return new THREE.Vector3(x, archY(x), archZ(x, side));
    }

    // ============================================================
    // 6. DECK / ROAD
    // ============================================================

    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, DECK_WIDTH + 1.0),
      concreteMat
    );
    slab.position.y = DECK_Y - 0.31;
    slab.castShadow = true;
    slab.receiveShadow = true;
    bridge.add(slab);
    markInspectable(slab, 'Deck beton', 'Pelat utama jembatan yang membawa beban lalu lintas ke sistem girder dan pelengkung.');

    const asphalt = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.16, 7.15),
      asphaltMat
    );
    asphalt.position.set(0, DECK_Y + 0.095, 0);
    asphalt.receiveShadow = true;
    bridge.add(asphalt);
    markInspectable(asphalt, 'Permukaan jalan', 'Zona utama interaksi Living Pulse ketika kendaraan melintas.');

    for (const side of [-1, 1]) {
      const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.24, 1.2),
        sidewalkMat
      );
      sidewalk.position.set(0, DECK_Y + 0.14, side * 4.45);
      sidewalk.castShadow = true;
      sidewalk.receiveShadow = true;
      bridge.add(sidewalk);
    }

    const centerLine = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.032, 0.10),
      yellowPaintMat
    );
    centerLine.position.set(0, DECK_Y + 0.195, 0);
    bridge.add(centerLine);

    for (const z of [-3.36, 3.36]) {
      const edgeLine = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.026, 0.075),
        whitePaintMat
      );
      edgeLine.position.set(0, DECK_Y + 0.196, z);
      bridge.add(edgeLine);
    }

    for (const side of [-1, 1]) {
      const edgeGirder = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, 0.34),
        steelRed
      );
      edgeGirder.position.set(0, DECK_Y - 0.60, side * 5.20);
      edgeGirder.castShadow = true;
      bridge.add(edgeGirder);
    }

    // ============================================================
    // 7. MAIN ARCH RIBS
    // ============================================================

    const archStations = [];
    for (let x = ARCH_START; x <= ARCH_END; x += 2) {
      archStations.push(x);
    }
    if (archStations[archStations.length - 1] !== ARCH_END) {
      archStations.push(ARCH_END);
    }

    for (const side of [-1, 1]) {
      for (let i = 0; i < archStations.length - 1; i++) {
        addBeam(
          archPoint(archStations[i], side),
          archPoint(archStations[i + 1], side),
          0.58,
          0.68,
          steelRed
        );
      }
    }

    // ============================================================
    // 8. HANGERS
    // ============================================================

    for (let x = -48; x <= 48; x += 6) {
      for (const side of [-1, 1]) {
        const top = archPoint(x, side);
        const bottom = new THREE.Vector3(x, DECK_Y + 0.30, side * 5.02);

        if (top.y > bottom.y + 0.6) {
          addCylinderBetween(bottom, top, 0.055, hangerMat);
        }
      }
    }

    // ============================================================
    // 9. BRACING ATAS - HANYA GARIS MELINTANG, TANPA X / DIAGONAL
    // ============================================================

    const topCrossStations = [-37, -29, -21, -13, -5, 5, 13, 21, 29, 37];

    for (const x of topCrossStations) {
      addBeam(
        archPoint(x, -1),
        archPoint(x, 1),
        0.20,
        0.24,
        steelDark
      );
    }

    // ============================================================
    // 10. FLOOR SYSTEM
    // ============================================================

    for (let x = -72.5; x <= 72.5; x += 5) {
      addBeam(
        new THREE.Vector3(x, DECK_Y - 0.72, -5.35),
        new THREE.Vector3(x, DECK_Y - 0.72, 5.35),
        0.30,
        0.34,
        steelDark
      );
    }

    // Side truss di bawah deck.
    for (const side of [-1, 1]) {
      const z = side * 5.22;
      const upperY = DECK_Y - 0.50;
      const lowerY = DECK_Y - 1.62;

      addBeam(
        new THREE.Vector3(-75, lowerY, z),
        new THREE.Vector3(75, lowerY, z),
        0.25,
        0.28,
        steelRed
      );

      for (let x = -75; x < 75; x += 5) {
        const nextX = Math.min(x + 5, 75);

        addBeam(
          new THREE.Vector3(x, upperY, z),
          new THREE.Vector3(x, lowerY, z),
          0.18,
          0.18,
          steelDark
        );

        const alternate = Math.floor((x + 75) / 5) % 2 === 0;

        if (alternate) {
          addBeam(
            new THREE.Vector3(x, lowerY, z),
            new THREE.Vector3(nextX, upperY, z),
            0.16,
            0.16,
            steelDark
          );
        } else {
          addBeam(
            new THREE.Vector3(x, upperY, z),
            new THREE.Vector3(nextX, lowerY, z),
            0.16,
            0.16,
            steelDark
          );
        }
      }
    }

    // ============================================================
    // 11. UNDER-BRACING KAKI ARCH
    // ============================================================

    for (const side of [-1, 1]) {
      const z = side * 5.0;

      // Kiri: kaki/tumpuan tepat di STA 25 m (local x = -50).
      addBeam(
        new THREE.Vector3(-64, -0.68, z),
        new THREE.Vector3(-50, -5.45, z),
        0.34,
        0.38,
        steelRed
      );

      addBeam(
        new THREE.Vector3(-50, -5.45, z),
        new THREE.Vector3(-36, -0.68, z),
        0.34,
        0.38,
        steelRed
      );

      // Kanan: kaki/tumpuan tepat di STA 125 m (local x = +50).
      addBeam(
        new THREE.Vector3(36, -0.68, z),
        new THREE.Vector3(50, -5.45, z),
        0.34,
        0.38,
        steelRed
      );

      addBeam(
        new THREE.Vector3(50, -5.45, z),
        new THREE.Vector3(64, -0.68, z),
        0.34,
        0.38,
        steelRed
      );
    }

    // ============================================================
    // 12. TUMPUAN ARCH + BASE PLATE + PIN + BAUT 3D
    // ============================================================

    function createNut(position) {
      const nut = new THREE.Mesh(
        new THREE.CylinderGeometry(0.20, 0.20, 0.16, 6),
        boltMat
      );
      nut.position.copy(position);
      nut.castShadow = true;
      bridge.add(nut);
    }

    function createArchBearing(x, side) {
      const base = archPoint(x, side);
      const z = base.z;

      // Pedestal beton tumpuan.
      // Permukaan air berada di y = -7.0.
      // Dasar pedestal dibuat sampai y = -8.25 agar bagian bawah
      // tumpuan tampak sedikit tenggelam di air.
      const WATER_LEVEL_Y = -7.0;
      const PEDESTAL_BOTTOM_Y = -8.75;
      const PEDESTAL_TOP_Y = ARCH_SPRING_Y - 0.28;
      const pedestalHeight = PEDESTAL_TOP_Y - PEDESTAL_BOTTOM_Y;

      const pedestal = new THREE.Mesh(
        new THREE.BoxGeometry(3.8, pedestalHeight, 3.2),
        concreteMat
      );

      pedestal.position.set(
        x,
        (PEDESTAL_TOP_Y + PEDESTAL_BOTTOM_Y) / 2,
        z
      );

      pedestal.castShadow = true;
      pedestal.receiveShadow = true;
      bridge.add(pedestal);

      // Collar tipis tepat di garis air supaya efek "masuk air"
      // terlihat jelas saat kamera diputar.
      const waterlineCollar = new THREE.Mesh(
        new THREE.BoxGeometry(3.95, 0.08, 3.35),
        bearingMat
      );

      waterlineCollar.position.set(
        x,
        WATER_LEVEL_Y + 0.03,
        z
      );

      waterlineCollar.castShadow = true;
      bridge.add(waterlineCollar);

      // Base plate.
      const basePlate = new THREE.Mesh(
        new THREE.BoxGeometry(3.4, 0.24, 2.8),
        bearingMat
      );
      basePlate.position.set(x, ARCH_SPRING_Y - 0.31, z);
      basePlate.castShadow = true;
      bridge.add(basePlate);
      markInspectable(basePlate, 'Tumpuan pelengkung', 'Zona transfer gaya pelengkung menuju pedestal beton dan fondasi.');

      // Dua plate tegak yang memegang pin.
      for (const dz of [-0.70, 0.70]) {
        const cheekPlate = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.25, 0.16),
          steelDark
        );
        cheekPlate.position.set(x, ARCH_SPRING_Y + 0.30, z + dz);
        cheekPlate.rotation.z = x < 0
          ? THREE.MathUtils.degToRad(-15)
          : THREE.MathUtils.degToRad(15);
        cheekPlate.castShadow = true;
        bridge.add(cheekPlate);
      }

      // Pin tumpuan melintang.
      addCylinderBetween(
        new THREE.Vector3(x, ARCH_SPRING_Y + 0.32, z - 0.95),
        new THREE.Vector3(x, ARCH_SPRING_Y + 0.32, z + 0.95),
        0.18,
        boltMat
      );

      // 4 anchor bolt + mur.
      const boltOffsets = [
        [-0.82, -0.62],
        [-0.82,  0.62],
        [ 0.82, -0.62],
        [ 0.82,  0.62]
      ];

      for (const [dx, dz] of boltOffsets) {
        const bolt = new THREE.Mesh(
          new THREE.CylinderGeometry(0.07, 0.07, 0.65, 10),
          boltMat
        );
        bolt.position.set(x + dx, ARCH_SPRING_Y + 0.02, z + dz);
        bolt.castShadow = true;
        bridge.add(bolt);

        createNut(
          new THREE.Vector3(
            x + dx,
            ARCH_SPRING_Y + 0.36,
            z + dz
          )
        );
      }
    }

    // Empat kaki arch.
    for (const x of [ARCH_START, ARCH_END]) {
      for (const side of [-1, 1]) {
        createArchBearing(x, side);
      }
    }

    // ============================================================
    // 13. RAILING
    // ============================================================

    for (const side of [-1, 1]) {
      const z = side * 5.02;

      addBeam(
        new THREE.Vector3(-75, 1.13, z),
        new THREE.Vector3(75, 1.13, z),
        0.10,
        0.10,
        railingMat
      );

      addBeam(
        new THREE.Vector3(-75, 0.68, z),
        new THREE.Vector3(75, 0.68, z),
        0.07,
        0.07,
        railingMat
      );

      for (let x = -75; x <= 75; x += 3) {
        addCylinderBetween(

    function addLamp(x, side) {
      const z = side * 4.70;

      addCylinderBetween(
        new THREE.Vector3(x, 0.36, z),
        new THREE.Vector3(x, 3.10, z),
        0.048,
        lampMat
      );

      const top = new THREE.Vector3(x, 3.10, z);
      const end = new THREE.Vector3(x, 3.15, z - side * 0.70);

      addCylinderBetween(top, end, 0.040, lampMat);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.10, 0.18),
        lampBulbMat
      );
      head.position.copy(end);
      head.position.z -= side * 0.12;
      head.castShadow = true;
      bridge.add(head);

      // Dynamic light on every second pole: brighter, but still bounded for performance.
      if (streetLampCounter % 2 === 0) {
        const glow = new THREE.PointLight(0xffd79b, 0, 24, 1.65);
        glow.position.set(end.x, 2.88, end.z - side * 0.34);
        bridge.add(glow);
        streetLampFills.push(glow);
      }

      // Cheap warm pool on asphalt so every pole visibly lights the road.
      const poolMat = new THREE.MeshBasicMaterial({
        map: lampPoolTex, transparent: true, opacity: 0, depthWrite: false,
        blending: THREE.AdditiveBlending, side: THREE.DoubleSide
      });
      const pool = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 4.0), poolMat);
      pool.rotation.x = -Math.PI / 2;
      pool.position.set(x, DECK_Y + 0.205, side * 2.18);
      bridge.add(pool);
      streetLampPools.push(poolMat);

      // A soft elongated reflection beneath the bridge on the moving water.
      const reflMat = new THREE.SpriteMaterial({
        map: waterReflectTex, transparent: true, opacity: 0, depthWrite: false,
        blending: THREE.AdditiveBlending, color: 0xffd39a
      });
      const reflection = new THREE.Sprite(reflMat);
      reflection.position.set(x, -6.72, side * 5.2);
      reflection.scale.set(2.2, 6.8, 1);
      scene.add(reflection);
      waterLampReflections.push(reflection);

      streetLampCounter++;
    }

    const cars = [];

    function makeTireTreadTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#777'; ctx.fillRect(0,0,c.width,c.height);
      ctx.strokeStyle = '#252525'; ctx.lineWidth = 8;
      for (let x=-40; x<c.width+40; x+=34) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+44,c.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+18,0); ctx.lineTo(x-22,c.height); ctx.stroke();
      }
      ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0,42); ctx.lineTo(c.width,42); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,86); ctx.lineTo(c.width,86); ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3.2, 1.0);
      return tex;
    }

    function makePaintFlakeNormal() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(128,128);
      let seed = 31291;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      for (let i=0; i<128*128; i++) {
        const o = i*4;
        const a = (rnd()-.5) * 18;
        const b = (rnd()-.5) * 18;
        img.data[o]   = 128 + a;
        img.data[o+1] = 128 + b;
        img.data[o+2] = 248;
        img.data[o+3] = 255;
      }
      ctx.putImageData(img,0,0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(18,18);
      return tex;
    }

    function addWheel(parent, x, z, radius = 0.34, width = 0.25) {
      const wheel = new THREE.Group();
      wheel.position.set(x, radius, z);

      const tireGeo = new THREE.CylinderGeometry(radius, radius, width, 24);
      tireGeo.rotateX(Math.PI / 2);
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      wheel.add(tire);

      const rimGeo = new THREE.CylinderGeometry(radius * 0.56, radius * 0.56, width + 0.016, 24);
      rimGeo.rotateX(Math.PI / 2);
      const rim = new THREE.Mesh(rimGeo, wheelMetalMat);
      wheel.add(rim);

      const discGeo = new THREE.CylinderGeometry(radius * 0.40, radius * 0.40, width + 0.022, 28);
      discGeo.rotateX(Math.PI / 2);
      const disc = new THREE.Mesh(discGeo, brakeDiscMat);
      wheel.add(disc);

      const caliper = new THREE.Mesh(new RoundedBoxGeometry(radius * .18, radius * .50, width + .040, 2, radius*.025), caliperMat);
      caliper.position.set(radius * .30, 0, 0);
      wheel.add(caliper);

      // Five sculpted spokes rotate with the wheel and catch environment light.
      for (let i=0; i<5; i++) {
        const spoke = new THREE.Mesh(
          new RoundedBoxGeometry(radius * .47, radius * .075, width + .040, 2, radius*.018),
          wheelMetalMat
        );
        spoke.position.x = radius * .22;
        spoke.rotation.z = i * Math.PI * 2 / 5;
        wheel.add(spoke);
      }
      const hubGeo = new THREE.CylinderGeometry(radius*.12, radius*.12, width+.055, 24);
      hubGeo.rotateX(Math.PI/2);
      wheel.add(new THREE.Mesh(hubGeo, chromeMat));

      parent.add(wheel);
      if (!parent.userData.wheels) parent.userData.wheels = [];
      parent.userData.wheels.push({ group: wheel, radius });
      return wheel;
    }

    addHill( 135, -68, 52, 25, 38, hillMat);
    addHill( 158,  58, 46, 21, 42, hillFarMat);
    addHill(-25, -122, 84, 28, 28, hillFarMat);
    addHill( 45,  126, 90, 30, 30, hillFarMat);

    function addTree(x, z, scale = 1) {
      const yBase = -6.72;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16*scale, 0.23*scale, 2.2*scale, 8), trunkMat);
      trunk.position.set(x, yBase + 1.1*scale, z);
      trunk.castShadow = true;
      scene.add(trunk);

      const mat = leafMats[Math.abs(Math.floor(x + z)) % leafMats.length];
      for (let i = 0; i < 3; i++) {
        const crown = new THREE.Mesh(new THREE.ConeGeometry((1.05 - i*0.12)*scale, 2.1*scale, 10), mat);
        crown.position.set(x, yBase + (2.4 + i*0.66)*scale, z);
        crown.castShadow = true;
        scene.add(crown);
      }
    }

    const treeSpots = [
      [-112,-24,1.25],[-120,18,1.05],[-131,48,1.35],[-104,64,1.12],[-145,-44,1.28],
      [112,-26,1.20],[124,14,1.02],[136,44,1.30],[103,67,1.15],[146,-46,1.26],
      [-92,-65,0.94],[-98,79,0.88],[92,-70,0.95],[96,82,0.90]
    ];
    treeSpots.forEach(([x,z,k]) => addTree(x,z,k));

    // Dense but deterministic tree layers on both banks. The center is kept
    // clear so the bridge silhouette and roadway stay readable.
    let forestSeed = 34871;
    const forestRand = () => { forestSeed = (forestSeed * 48271) % 2147483647; return forestSeed / 2147483647; };
    for (const side of [-1, 1]) {
      for (let i = 0; i < 34; i++) {
        const x = side * (86 + forestRand() * 78);
        let z = -82 + forestRand() * 164;
        if (Math.abs(z) < 9) z += z < 0 ? -12 : 12;
        addTree(x, z, 0.55 + forestRand() * 0.72);
      }
    }

    function addRock(x, z, scale = 1) {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9*scale, 0), rockMat);
      rock.scale.y = 0.65;
      rock.position.set(x, -6.35, z);
      rock.rotation.set(0.2, x*0.03, -0.12);
      rock.castShadow = true;
      scene.add(rock);
    }
    [[-76,-28,1.4],[-83,33,1.1],[77,-32,1.25],[86,27,1.0],[-32,-48,0.9],[38,46,1.15]].forEach(v=>addRock(...v));


    // Burung sederhana untuk menambah kedalaman pemandangan.
    const birdMat = new THREE.LineBasicMaterial({ color: 0x48545a, transparent: true, opacity: 0.72 });
    function addBird(x, y, z, scale = 1) {
      const pts = [
        new THREE.Vector3(-1*scale,0,0),
        new THREE.Vector3(0,0.32*scale,0),
        new THREE.Vector3(1*scale,0,0)
      ];
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      const bird = new THREE.Line(g, birdMat);
      bird.position.set(x,y,z); scene.add(bird);
    }
    addBird(-48, 29, -82, 1.2); addBird(-40, 32, -86, 0.9); addBird(58, 25, -70, 1.0);

    // Tiny warm particles catch the low sun and add depth close to the camera.
    const moteGeo = new THREE.BufferGeometry();
    const moteCount = 220;
    const motePos = new Float32Array(moteCount * 3);
    let moteSeed = 22991;
    const moteRand = () => { moteSeed = (moteSeed * 16807) % 2147483647; return moteSeed / 2147483647; };
    for (let i = 0; i < moteCount; i++) {
      motePos[i*3] = -130 + moteRand() * 260;
      motePos[i*3+1] = -1 + moteRand() * 28;
      motePos[i*3+2] = -75 + moteRand() * 150;
    }
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const moteMat = new THREE.PointsMaterial({ color: 0xffe4b5, size: 0.09, transparent: true, opacity: 0.34, depthWrite: false });
    const motes = new THREE.Points(moteGeo, moteMat);
    scene.add(motes);

    // ============================================================
    // 17C. FPS EXPLORATION + RIDE CAM
    // ============================================================

    let exploreMode = false;
    let rideMode = false;
    let rideIndex = 0;
    const keyState = Object.create(null);

    const player = {
      position: new THREE.Vector3(-116, 0.22, 2.85),
      yaw: -Math.PI / 2,
      pitch: 0,
      eyeHeight: 1.68,
      verticalVelocity: 0,
      grounded: true,
      bobPhase: 0
    };

    camera.rotation.order = 'YXZ';

    function setCameraFov(value) {
      if (Math.abs(camera.fov - value) > 0.02) {
        camera.fov = value;
        camera.updateProjectionMatrix();
      }
    }

    function updateFpsUi() {
      document.getElementById('toggleExplore').classList.toggle('active', exploreMode);
      document.getElementById('fpsHud').classList.toggle('show', exploreMode);
      const locked = document.pointerLockElement === renderer.domElement;
      document.getElementById('lockHint').classList.toggle('show', exploreMode && !locked);
    }

    function setExploreMode(enabled, requestLock = true) {
      if (enabled && rideMode) setRideMode(false);
      exploreMode = enabled;
      controls.enabled = !enabled && !rideMode;

      if (enabled) {
        setCameraFov(72);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch;
        camera.rotation.z = 0;
        camera.position.set(player.position.x, player.position.y + player.eyeHeight, player.position.z);
        if (requestLock && renderer.domElement.requestPointerLock) {
          renderer.domElement.requestPointerLock();
        }
      } else {
        if (document.pointerLockElement === renderer.domElement && document.exitPointerLock) {
          document.exitPointerLock();
        }
        setCameraFov(38);
        camera.rotation.z = 0;
        controls.target.set(player.position.x, 1.0, player.position.z);
        camera.position.set(player.position.x - 14, 8.5, player.position.z + 11);
        controls.update();
      }
      updateFpsUi();
    }

    function setRideMode(enabled) {
      if (enabled && exploreMode) setExploreMode(false);
      rideMode = enabled;
      controls.enabled = !rideMode && !exploreMode;
      document.getElementById('toggleRide').classList.toggle('active', rideMode);
      document.getElementById('rideHud').classList.toggle('show', rideMode);
      if (rideMode) {
        setCameraFov(52);
        const car = cars[rideIndex % cars.length];
        document.getElementById('rideName').textContent = car.userData.name.toUpperCase();
      } else {
        setCameraFov(38);
        camera.rotation.z = 0;
      }
    }

    function cycleRide() {
      if (!rideMode) {
        setRideMode(true);
        return;
      }
      rideIndex = (rideIndex + 1) % cars.length;
      document.getElementById('rideName').textContent = cars[rideIndex].userData.name.toUpperCase();
    }

    document.addEventListener('pointerlockchange', () => {
      if (exploreMode && document.pointerLockElement !== renderer.domElement) {
        // ESC pada browser = keluar FPS, seperti game.
        setExploreMode(false, false);
      }
      updateFpsUi();
    });

    renderer.domElement.addEventListener('click', () => {
      if (exploreMode && document.pointerLockElement !== renderer.domElement) {
        renderer.domElement.requestPointerLock?.();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!exploreMode || document.pointerLockElement !== renderer.domElement) return;
      player.yaw -= e.movementX * 0.00215;
      player.pitch -= e.movementY * 0.00195;
      player.pitch = THREE.MathUtils.clamp(player.pitch, -1.38, 1.38);
    });

    function updateExplore(delta, elapsed) {
      if (!exploreMode) return;

      let forwardInput = 0;
      let sideInput = 0;
      if (keyState['w'] || keyState['arrowup']) forwardInput += 1;
      if (keyState['s'] || keyState['arrowdown']) forwardInput -= 1;
      if (keyState['d'] || keyState['arrowright']) sideInput += 1;
      if (keyState['a'] || keyState['arrowleft']) sideInput -= 1;

      const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const move = new THREE.Vector3();
      move.addScaledVector(forward, forwardInput);
      move.addScaledVector(right, sideInput);
      if (move.lengthSq() > 1) move.normalize();

      const moving = move.lengthSq() > 0.001;
      const sprinting = moving && !!keyState['shift'];
      const speed = sprinting ? 8.6 : 4.65;

      if (moving) {
        player.position.addScaledVector(move, speed * delta);
        player.position.x = THREE.MathUtils.clamp(player.position.x, -124.5, 124.5);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -3.92, 3.92);
        player.bobPhase += delta * (sprinting ? 13.2 : 8.5);
      }

      const groundY = 0.22;
      player.verticalVelocity -= 15.5 * delta;
      player.position.y += player.verticalVelocity * delta;
      if (player.position.y <= groundY) {
        player.position.y = groundY;
        player.verticalVelocity = 0;
        player.grounded = true;
      }

      let bobY = 0;
      let bobX = 0;
      if (moving && player.grounded) {
        bobY = Math.abs(Math.sin(player.bobPhase)) * (sprinting ? .055 : .035);
        bobX = Math.sin(player.bobPhase * .5) * (sprinting ? .018 : .011);
      }

      // Efek kendaraan lewat dekat pemain: sangat halus, bukan camera shake berlebihan.
      let proximity = 0;
      for (const car of cars) {
        const dx = car.position.x - player.position.x;
        const dz = car.position.z - player.position.z;
        const d = Math.hypot(dx, dz);
        if (d < 4.3) proximity = Math.max(proximity, 1 - d / 4.3);
      }
      const passShake = proximity * 0.012;

      camera.position.set(
        player.position.x + right.x * bobX + Math.sin(elapsed * 72) * passShake,
        player.position.y + player.eyeHeight + bobY,
        player.position.z + right.z * bobX
      );
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
      camera.rotation.z = Math.sin(elapsed * 61) * passShake * .6;

      const targetFov = sprinting ? 80 : 72;
      camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 1 - Math.pow(.0008, delta));
      camera.updateProjectionMatrix();
    }

    function updateRideCamera(delta) {
      if (!rideMode || cars.length === 0) return;
      const car = cars[rideIndex % cars.length];
      const forward = new THREE.Vector3(1,0,0).applyQuaternion(car.quaternion).normalize();
      const right = new THREE.Vector3(0,0,1).applyQuaternion(car.quaternion).normalize();

      const desired = car.position.clone()
        .addScaledVector(forward, -7.2)
        .addScaledVector(right, 0.5);
      desired.y += 3.2;

      const target = car.position.clone().addScaledVector(forward, 8.0);
      target.y += 1.05;

      const follow = 1 - Math.pow(0.003, delta);
      camera.position.lerp(desired, follow);
      camera.lookAt(target);
      camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, 0, follow);
      document.getElementById('rideName').textContent = car.userData.name.toUpperCase();
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)) {
        keyState[k] = true;
        if (exploreMode) e.preventDefault();
      }
      if (k === ' ' && exploreMode && player.grounded) {
        player.verticalVelocity = 5.35;
        player.grounded = false;
        e.preventDefault();
      }
      if (k === 'r' && rideMode) cycleRide();
      if (e.key === 'Escape' && rideMode) setRideMode(false);
    });

    window.addEventListener('keyup', (e) => {
      keyState[e.key.toLowerCase()] = false;
    });

    // 18. ANIMATION + ADAPTIVE QUALITY
    // ============================================================

    const clock = new THREE.Clock();
    let trafficRunning = true;
    let fpsFrames = 0;
    let fpsTime = 0;
    let lastQualityChange = -10;

    // 30 detik siang + 30 detik malam = satu siklus 60 detik.
    const DAY_SECONDS = 30;
    const NIGHT_SECONDS = 30;
    const CYCLE_SECONDS = DAY_SECONDS + NIGHT_SECONDS;
    let nightFactor = 0;

    const dayTop = new THREE.Color(0x6f93a8);
    const dayHorizon = new THREE.Color(0xe8c7a7);
    const dayLower = new THREE.Color(0xd8d8c5);
    const nightTop = new THREE.Color(0x071426);
    const nightHorizon = new THREE.Color(0x183b63);
    const nightLower = new THREE.Color(0x243b50);
    const dayFog = new THREE.Color(0xb8c4c0);
    const nightFog = new THREE.Color(0x15293c);
    const dayBackground = new THREE.Color(0xbccbd0);
    const nightBackground = new THREE.Color(0x0b1c2f);
    const dayWaterSky = new THREE.Color(0xcad9dc);
    const nightWaterSky = new THREE.Color(0x1a4c68);
    const cycleHud = document.getElementById('cycleHud');
    const cycleText = document.getElementById('cycleText');
    const cycleTime = document.getElementById('cycleTime');

    function updateDayNight(elapsed) {
      const cycleTimeSec = elapsed % CYCLE_SECONDS;
      const phase = cycleTimeSec / CYCLE_SECONDS;
      const angle = phase * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      // Smooth transition sekitar horizon, bukan pergantian mendadak.
      nightFactor = THREE.MathUtils.smoothstep(-sunHeight, -0.10, 0.10);
      const dayFactor = 1 - nightFactor;

      // Matahari melakukan satu lintasan penuh tiap 60 detik.
      const orbitRadius = 180;
      const sunX = -Math.cos(angle) * 145;
      const sunY = Math.sin(angle) * 110;
      const sunZ = 108;
      sun.position.set(sunX, sunY, sunZ);
      sunVisual.position.set(sunX * 1.75, sunY * 1.75, sunZ * 1.75);
      sunVisual.material.opacity = THREE.MathUtils.clamp(dayFactor * 1.15, 0, 1);
      sunVisual.visible = sunVisual.material.opacity > 0.02;

      // Bulan berada di sisi orbit yang berlawanan.
      const moonX = -sunX;
      const moonY = -sunY;
      const moonZ = -105;
      moonLight.position.set(moonX, Math.max(18, moonY), moonZ);
      moonVisual.position.set(moonX * 1.75, moonY * 1.75, moonZ * 1.75);
      moonVisual.material.opacity = THREE.MathUtils.clamp(nightFactor * 1.1, 0, 1);
      moonVisual.visible = moonVisual.material.opacity > 0.02 && moonY > -10;

      sun.intensity = THREE.MathUtils.lerp(0.04, 3.15, dayFactor);
      warmFill.intensity = THREE.MathUtils.lerp(0.07, 0.42, dayFactor);
      moonLight.intensity = THREE.MathUtils.lerp(0.0, 1.05, nightFactor);
      nightFill.intensity = THREE.MathUtils.lerp(0.0, 0.42, nightFactor);
      hemiLight.intensity = THREE.MathUtils.lerp(0.56, 1.65, dayFactor);

      // Sky, fog, water dan exposure ikut berubah.
      skyMat.uniforms.uTop.value.lerpColors(dayTop, nightTop, nightFactor);
      skyMat.uniforms.uHorizon.value.lerpColors(dayHorizon, nightHorizon, nightFactor);
      skyMat.uniforms.uLower.value.lerpColors(dayLower, nightLower, nightFactor);
      skyMat.uniforms.uSunDirection.value.copy(sun.position).normalize();
      waterMat.uniforms.uSunDir.value.copy(sun.position).normalize();
      waterMat.uniforms.uMoonDir.value.copy(moonLight.position).normalize();
      waterMat.uniforms.uNight.value = nightFactor;
      waterMat.uniforms.uSky.value.lerpColors(dayWaterSky, nightWaterSky, nightFactor);
      scene.fog.color.lerpColors(dayFog, nightFog, nightFactor);
      scene.background.lerpColors(dayBackground, nightBackground, nightFactor);
      renderer.toneMappingExposure = THREE.MathUtils.lerp(1.20, 1.08, dayFactor);
      bloomPass.strength = THREE.MathUtils.lerp(0.54, 0.18, dayFactor);

      // Automotive paint changes reflection energy with the time of day. Cars
      // stay glossy at night but become especially crisp under daylight.
      for (const mat of vehiclePaintMaterials) {
        mat.envMapIntensity = THREE.MathUtils.lerp(1.55, 2.85, dayFactor);
        mat.clearcoatRoughness = THREE.MathUtils.lerp(.055, .032, dayFactor);
      }
      darkGlassMat.envMapIntensity = THREE.MathUtils.lerp(1.45, 2.40, dayFactor);
      chromeMat.envMapIntensity = THREE.MathUtils.lerp(1.70, 3.10, dayFactor);
      wheelMetalMat.envMapIntensity = THREE.MathUtils.lerp(1.55, 2.55, dayFactor);

      stars.visible = nightFactor > 0.02;
      starMat.opacity = Math.pow(nightFactor, 1.25) * 0.86;
      for (let i = 0; i < clouds.length; i++) {
        clouds[i].material.opacity = THREE.MathUtils.lerp(0.17, 0.52, dayFactor);
      }

      // Lampu jalan dan kendaraan menyala otomatis ketika gelap.
      lampBulbMat.emissiveIntensity = nightFactor * 8.5;
      for (const light of streetLampFills) light.intensity = nightFactor * 21.0;
      for (const mat of streetLampPools) mat.opacity = nightFactor * 0.72;
      for (let i = 0; i < waterLampReflections.length; i++) {
        const reflection = waterLampReflections[i];
        reflection.material.opacity = nightFactor * (0.22 + 0.10 * Math.sin(elapsed * 1.8 + i * 1.37));
        reflection.scale.y = 6.8 + Math.sin(elapsed * 1.25 + i) * 1.1;
      }
      headlightMat.emissiveIntensity = THREE.MathUtils.lerp(0.45, 6.8, nightFactor);
      taillightMat.emissiveIntensity = THREE.MathUtils.lerp(0.50, 3.2, nightFactor) + (trafficRunning ? 0 : 0.55);
      for (const car of cars) {
        if (car.userData.headBeam) car.userData.headBeam.intensity = nightFactor * 40.0;
      }

      // HUD hanya satu indikator kecil: SIANG / MALAM + countdown.
      const isDay = cycleTimeSec < DAY_SECONDS;
      const withinPhase = isDay ? cycleTimeSec : cycleTimeSec - DAY_SECONDS;
      const remaining = Math.max(0, Math.ceil(30 - withinPhase));
      cycleText.textContent = isDay ? 'SIANG' : 'MALAM';
      cycleTime.textContent = `00:${String(remaining).padStart(2, '0')}`;
      cycleHud.classList.toggle('night', !isDay);
    }

    function applyDpr(next) {
      const clamped = THREE.MathUtils.clamp(next, 0.85, MAX_DPR);
      if (Math.abs(clamped - activeDpr) < 0.04) return;
      activeDpr = clamped;
      renderer.setPixelRatio(activeDpr);
      composer.setPixelRatio(activeDpr);
    }

    function updateAdaptiveQuality(delta, elapsed) {
      fpsFrames++;
      fpsTime += delta;
      if (fpsTime < 2.25) return;
      const fps = fpsFrames / fpsTime;
      fpsFrames = 0;
      fpsTime = 0;

      if (elapsed - lastQualityChange < 5) return;
      if (fps < 42 && activeDpr > .9) {
        applyDpr(activeDpr - .15);
        bloomPass.strength = Math.max(.11, bloomPass.strength - .025);
        lastQualityChange = elapsed;
      } else if (fps > 57 && activeDpr < MAX_DPR - .04) {
        applyDpr(activeDpr + .10);
        bloomPass.strength = Math.min(.18, bloomPass.strength + .015);
        lastQualityChange = elapsed;
      }
    }

    function updateCars(delta, elapsed) {
      if (!trafficRunning) return;

      const minX = -126;
      const maxX = 126;

      for (const car of cars) {
        const previousX = car.position.x;
        const travelled = car.userData.speed * delta;
        car.position.x += car.userData.direction * travelled;
        car.userData.pulseCooldown = Math.max(0, (car.userData.pulseCooldown || 0) - delta);

        if (car.userData.wheels) {
          for (const wheel of car.userData.wheels) {
            wheel.group.rotation.z -= travelled / wheel.radius;
          }
        }

        // Sedikit gerak suspensi, cukup untuk menghilangkan kesan mobil meluncur seperti balok.
        car.position.y = DECK_Y + 0.20 + Math.sin(elapsed * 6.0 + car.userData.phase) * 0.006;

        const sensors = [-34, 0, 34];
        let crossed = false;
        for (const sensorX of sensors) {
          if ((previousX < sensorX && car.position.x >= sensorX) ||
              (previousX > sensorX && car.position.x <= sensorX)) {
            crossed = true;
            break;
          }
        }
        if (crossed && car.userData.pulseCooldown <= 0) {
          const weight = car.userData.name.includes('Truck') ? 2.1 : car.userData.name.includes('SUV') ? 1.35 : 1.0;
          triggerBridgePulse(car.position.x, weight);
          car.userData.pulseCooldown = .85;
        }

        if (car.userData.direction > 0 && car.position.x > maxX) car.position.x = minX;
        if (car.userData.direction < 0 && car.position.x < minX) car.position.x = maxX;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      updateDayNight(elapsed);
      updateCars(delta, elapsed);
      updateBridgePulse(delta);
      updateExplore(delta, elapsed);
      updateRideCamera(delta);
      updateAdaptiveQuality(delta, elapsed);

      waterMat.uniforms.uTime.value = elapsed;
      motes.rotation.y = elapsed * 0.004;
      for (let i = 0; i < clouds.length; i++) {
        clouds[i].position.x += Math.sin(elapsed * 0.03 + i) * 0.0013;
      }

      if (!exploreMode && !rideMode) controls.update();
      composer.render();
    }

    animate();

    // ============================================================
    // 19. MINIMAL CONTROLS
    // ============================================================

    document.getElementById('resetCamera').addEventListener('click', () => {
      if (exploreMode) setExploreMode(false);
      if (rideMode) setRideMode(false);
      camera.position.set(118,56,92);
      camera.rotation.set(0,0,0);
      setCameraFov(38);
      controls.target.set(0,1.4,0);
      controls.enabled = true;
      controls.update();
    });

    document.getElementById('toggleExplore').addEventListener('click', () => {
      setExploreMode(!exploreMode);
    });

    document.getElementById('toggleRide').addEventListener('click', () => {
      cycleRide();
    });

    const trafficButton = document.getElementById('toggleTraffic');
    trafficButton.addEventListener('click', () => {
      trafficRunning = !trafficRunning;
      trafficButton.textContent = trafficRunning ? 'Pause' : 'Jalankan';
      trafficButton.classList.toggle('active', !trafficRunning);
    });

    // ============================================================
    // 20. RESIZE
    // ============================================================

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      const responsiveMax = window.matchMedia('(max-width: 760px), (pointer: coarse)').matches ? 1.0 : MAX_DPR;
      activeDpr = Math.min(activeDpr, responsiveMax, window.devicePixelRatio);
      renderer.setPixelRatio(activeDpr);
      composer.setPixelRatio(activeDpr);
    });
  </script>
</body>
</html>
