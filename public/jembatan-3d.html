<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jembatan Sirotu - Visualisasi 3D</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef2f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      top: 18px;
      left: 22px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 8px 30px rgba(15,23,42,.08);
      backdrop-filter: blur(10px);
    }

    #overlay h1 {
      margin: 0;
      color: #b91c1c;
      font-size: 16px;
      line-height: 1;
      letter-spacing: .14em;
      font-weight: 900;
    }

    #overlay p {
      margin: 7px 0 10px;
      color: #475569;
      font-size: 11px;
    }

    #overlay .buttons {
      display: flex;
      gap: 7px;
    }

    #overlay button {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      background: #b91c1c;
      color: #fff;
    }

    #overlay button.secondary {
      background: #e5e7eb;
      color: #334155;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <h1>JEMBATAN SIROTU</h1>
    <p>Drag: putar · Scroll: zoom · Klik kanan: geser</p>
    <div class="buttons">
      <button id="resetCamera">Reset kamera</button>
      <button id="toggleTraffic" class="secondary">Pause mobil</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ============================================================
    // 1. SCENE / CAMERA / RENDERER
    // ============================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeef2f3);
    scene.fog = new THREE.Fog(0xeef2f3, 175, 360);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(118, 56, 92);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.4, 0);
    controls.minDistance = 48;
    controls.maxDistance = 280;
    controls.maxPolarAngle = Math.PI * 0.495;

    // ============================================================
    // 2. LIGHT
    // ============================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x75896a, 1.8));

    const sun = new THREE.DirectionalLight(0xffffff, 2.9);
    sun.position.set(-75, 105, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -140;
    sun.shadow.camera.right = 140;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 320;
    scene.add(sun);

    // ============================================================
    // 3. MATERIAL
    // ============================================================

    const steelRed = new THREE.MeshStandardMaterial({
      color: 0xf23832,
      metalness: 0.24,
      roughness: 0.42
    });

    const steelDark = new THREE.MeshStandardMaterial({
      color: 0xc72525,
      metalness: 0.32,
      roughness: 0.42
    });

    const hangerMat = new THREE.MeshStandardMaterial({
      color: 0xc5a632,
      metalness: 0.48,
      roughness: 0.36
    });

    const asphaltMat = new THREE.MeshStandardMaterial({
      color: 0x27292b,
      roughness: 0.96
    });

    const concreteMat = new THREE.MeshStandardMaterial({
      color: 0xc8c8c2,
      roughness: 0.88
    });

    const sidewalkMat = new THREE.MeshStandardMaterial({
      color: 0xe7e4dc,
      roughness: 0.86
    });

    const whitePaintMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.72
    });

    const yellowPaintMat = new THREE.MeshStandardMaterial({
      color: 0xf1cf12,
      roughness: 0.70
    });

    const railingMat = new THREE.MeshStandardMaterial({
      color: 0xe4a0a0,
      metalness: 0.18,
      roughness: 0.50
    });

    const lampMat = new THREE.MeshStandardMaterial({
      color: 0xd7ddda,
      metalness: 0.55,
      roughness: 0.34
    });

    const bearingMat = new THREE.MeshStandardMaterial({
      color: 0x3f4449,
      metalness: 0.72,
      roughness: 0.26
    });

    const boltMat = new THREE.MeshStandardMaterial({
      color: 0x9ca3a8,
      metalness: 0.86,
      roughness: 0.20
    });

    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x17b9dc,
      roughness: 0.20,
      transparent: true,
      opacity: 0.92
    });

    const landMat = new THREE.MeshStandardMaterial({
      color: 0x748d57,
      roughness: 1.0
    });

    const contourMat = new THREE.LineBasicMaterial({
      color: 0x40583a,
      transparent: true,
      opacity: 0.60
    });

    // ============================================================
    // 4. DIMENSI UTAMA
    // ============================================================

    // Koordinat model dipusatkan di tengah jembatan:
// STA 0 = x -75, STA 25 = x -50, STA 125 = x +50, STA 150 = x +75.
    const BRIDGE_LENGTH = 150;
    const DECK_WIDTH = 10;
    const DECK_Y = 0;

    const ARCH_START = -50; // STA 25 m
    const ARCH_END = 50; // STA 125 m
    const ARCH_SPRING_Y = -3.80; // diturunkan lagi
    const ARCH_RISE = 17.65; // menjaga elevasi puncak arch tetap hampir sama
    const ARCH_BASE_HALF_WIDTH = 6.05;
    const ARCH_TILT = THREE.MathUtils.degToRad(10);

    const bridge = new THREE.Group();
    scene.add(bridge);

    // ============================================================
    // 5. HELPER
    // ============================================================

    function addBeam(p1, p2, height, width, material, parent = bridge) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(length, height, width),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(1, 0, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinderBetween(p1, p2, radius, material, parent = bridge, segments = 10) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function archY(x) {
      const t = (x - ARCH_START) / (ARCH_END - ARCH_START);
      if (t < 0 || t > 1) return ARCH_SPRING_Y;
      return ARCH_SPRING_Y + ARCH_RISE * 4 * t * (1 - t);
    }

    function archZ(x, side) {
      const y = archY(x);
      const inward = Math.tan(ARCH_TILT) * Math.max(0, y - ARCH_SPRING_Y);
      return side * Math.max(2.95, ARCH_BASE_HALF_WIDTH - inward);
    }

    function archPoint(x, side) {
      return new THREE.Vector3(x, archY(x), archZ(x, side));
    }

    // ============================================================
    // 6. DECK / ROAD
    // ============================================================

    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, DECK_WIDTH + 1.0),
      concreteMat
    );
    slab.position.y = DECK_Y - 0.31;
    slab.castShadow = true;
    slab.receiveShadow = true;
    bridge.add(slab);

    const asphalt = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.16, 7.15),
      asphaltMat
    );
    asphalt.position.set(0, DECK_Y + 0.095, 0);
    asphalt.receiveShadow = true;
    bridge.add(asphalt);

    for (const side of [-1, 1]) {
      const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.24, 1.2),
        sidewalkMat
      );
      sidewalk.position.set(0, DECK_Y + 0.14, side * 4.45);
      sidewalk.castShadow = true;
      sidewalk.receiveShadow = true;
      bridge.add(sidewalk);
    }

    const centerLine = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.032, 0.10),
      yellowPaintMat
    );
    centerLine.position.set(0, DECK_Y + 0.195, 0);
    bridge.add(centerLine);

    for (const z of [-3.36, 3.36]) {
      const edgeLine = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.026, 0.075),
        whitePaintMat
      );
      edgeLine.position.set(0, DECK_Y + 0.196, z);
      bridge.add(edgeLine);
    }

    for (const side of [-1, 1]) {
      const edgeGirder = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, 0.34),
        steelRed
      );
      edgeGirder.position.set(0, DECK_Y - 0.60, side * 5.20);
      edgeGirder.castShadow = true;
      bridge.add(edgeGirder);
    }

    // ============================================================
    // 7. MAIN ARCH RIBS
    // ============================================================

    const archStations = [];
    for (let x = ARCH_START; x <= ARCH_END; x += 2) {
      archStations.push(x);
    }
    if (archStations[archStations.length - 1] !== ARCH_END) {
      archStations.push(ARCH_END);
    }

    for (const side of [-1, 1]) {
      for (let i = 0; i < archStations.length - 1; i++) {
        addBeam(
          archPoint(archStations[i], side),
          archPoint(archStations[i + 1], side),
          0.58,
          0.68,
          steelRed
        );
      }
    }

    // ============================================================
    // 8. HANGERS
    // ============================================================

    for (let x = -48; x <= 48; x += 6) {
      for (const side of [-1, 1]) {
        const top = archPoint(x, side);
        const bottom = new THREE.Vector3(x, DECK_Y + 0.30, side * 5.02);

        if (top.y > bottom.y + 0.6) {
          addCylinderBetween(bottom, top, 0.055, hangerMat);
        }
      }
    }

    // ============================================================
    // 9. BRACING ATAS - HANYA GARIS MELINTANG, TANPA X / DIAGONAL
    // ============================================================

    const topCrossStations = [-37, -29, -21, -13, -5, 5, 13, 21, 29, 37];

    for (const x of topCrossStations) {
      addBeam(
        archPoint(x, -1),
        archPoint(x, 1),
        0.20,
        0.24,
        steelDark
      );
    }

    // ============================================================
    // 10. FLOOR SYSTEM
    // ============================================================

    for (let x = -72.5; x <= 72.5; x += 5) {
      addBeam(
        new THREE.Vector3(x, DECK_Y - 0.72, -5.35),
        new THREE.Vector3(x, DECK_Y - 0.72, 5.35),
        0.30,
        0.34,
        steelDark
      );
    }

    // Side truss di bawah deck.
    for (const side of [-1, 1]) {
      const z = side * 5.22;
      const upperY = DECK_Y - 0.50;
      const lowerY = DECK_Y - 1.62;

      addBeam(
        new THREE.Vector3(-75, lowerY, z),
        new THREE.Vector3(75, lowerY, z),
        0.25,
        0.28,
        steelRed
      );

      for (let x = -75; x < 75; x += 5) {
        const nextX = Math.min(x + 5, 75);

        addBeam(
          new THREE.Vector3(x, upperY, z),
          new THREE.Vector3(x, lowerY, z),
          0.18,
          0.18,
          steelDark
        );

        const alternate = Math.floor((x + 75) / 5) % 2 === 0;

        if (alternate) {
          addBeam(
            new THREE.Vector3(x, lowerY, z),
            new THREE.Vector3(nextX, upperY, z),
            0.16,
            0.16,
            steelDark
          );
        } else {
          addBeam(
            new THREE.Vector3(x, upperY, z),
            new THREE.Vector3(nextX, lowerY, z),
            0.16,
            0.16,
            steelDark
          );
        }
      }
    }

    // ============================================================
    // 11. UNDER-BRACING KAKI ARCH
    // ============================================================

    for (const side of [-1, 1]) {
      const z = side * 5.0;

      // Kiri: kaki/tumpuan tepat di STA 25 m (local x = -50).
      addBeam(
        new THREE.Vector3(-64, -0.68, z),
        new THREE.Vector3(-50, -5.45, z),
        0.34,
        0.38,
        steelRed
      );

      addBeam(
        new THREE.Vector3(-50, -5.45, z),
        new THREE.Vector3(-36, -0.68, z),
        0.34,
        0.38,
        steelRed
      );

      // Kanan: kaki/tumpuan tepat di STA 125 m (local x = +50).
      addBeam(
        new THREE.Vector3(36, -0.68, z),
        new THREE.Vector3(50, -5.45, z),
        0.34,
        0.38,
        steelRed
      );

      addBeam(
        new THREE.Vector3(50, -5.45, z),
        new THREE.Vector3(64, -0.68, z),
        0.34,
        0.38,
        steelRed
      );
    }

    // ============================================================
    // 12. TUMPUAN ARCH + BASE PLATE + PIN + BAUT 3D
    // ============================================================

    function createNut(position) {
      const nut = new THREE.Mesh(
        new THREE.CylinderGeometry(0.20, 0.20, 0.16, 6),
        boltMat
      );
      nut.position.copy(position);
      nut.castShadow = true;
      bridge.add(nut);
    }

    function createArchBearing(x, side) {
      const base = archPoint(x, side);
      const z = base.z;

      // Pedestal beton tumpuan.
      // Permukaan air berada di y = -7.0.
      // Dasar pedestal dibuat sampai y = -8.25 agar bagian bawah
      // tumpuan tampak sedikit tenggelam di air.
      const WATER_LEVEL_Y = -7.0;
      const PEDESTAL_BOTTOM_Y = -8.75;
      const PEDESTAL_TOP_Y = ARCH_SPRING_Y - 0.28;
      const pedestalHeight = PEDESTAL_TOP_Y - PEDESTAL_BOTTOM_Y;

      const pedestal = new THREE.Mesh(
        new THREE.BoxGeometry(3.8, pedestalHeight, 3.2),
        concreteMat
      );

      pedestal.position.set(
        x,
        (PEDESTAL_TOP_Y + PEDESTAL_BOTTOM_Y) / 2,
        z
      );

      pedestal.castShadow = true;
      pedestal.receiveShadow = true;
      bridge.add(pedestal);

      // Collar tipis tepat di garis air supaya efek "masuk air"
      // terlihat jelas saat kamera diputar.
      const waterlineCollar = new THREE.Mesh(
        new THREE.BoxGeometry(3.95, 0.08, 3.35),
        bearingMat
      );

      waterlineCollar.position.set(
        x,
        WATER_LEVEL_Y + 0.03,
        z
      );

      waterlineCollar.castShadow = true;
      bridge.add(waterlineCollar);

      // Base plate.
      const basePlate = new THREE.Mesh(
        new THREE.BoxGeometry(3.4, 0.24, 2.8),
        bearingMat
      );
      basePlate.position.set(x, ARCH_SPRING_Y - 0.31, z);
      basePlate.castShadow = true;
      bridge.add(basePlate);

      // Dua plate tegak yang memegang pin.
      for (const dz of [-0.70, 0.70]) {
        const cheekPlate = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.25, 0.16),
          steelDark
        );
        cheekPlate.position.set(x, ARCH_SPRING_Y + 0.30, z + dz);
        cheekPlate.rotation.z = x < 0
          ? THREE.MathUtils.degToRad(-15)
          : THREE.MathUtils.degToRad(15);
        cheekPlate.castShadow = true;
        bridge.add(cheekPlate);
      }

      // Pin tumpuan melintang.
      addCylinderBetween(
        new THREE.Vector3(x, ARCH_SPRING_Y + 0.32, z - 0.95),
        new THREE.Vector3(x, ARCH_SPRING_Y + 0.32, z + 0.95),
        0.18,
        boltMat
      );

      // 4 anchor bolt + mur.
      const boltOffsets = [
        [-0.82, -0.62],
        [-0.82,  0.62],
        [ 0.82, -0.62],
        [ 0.82,  0.62]
      ];

      for (const [dx, dz] of boltOffsets) {
        const bolt = new THREE.Mesh(
          new THREE.CylinderGeometry(0.07, 0.07, 0.65, 10),
          boltMat
        );
        bolt.position.set(x + dx, ARCH_SPRING_Y + 0.02, z + dz);
        bolt.castShadow = true;
        bridge.add(bolt);

        createNut(
          new THREE.Vector3(
            x + dx,
            ARCH_SPRING_Y + 0.36,
            z + dz
          )
        );
      }
    }

    // Empat kaki arch.
    for (const x of [ARCH_START, ARCH_END]) {
      for (const side of [-1, 1]) {
        createArchBearing(x, side);
      }
    }

    // ============================================================
    // 13. RAILING
    // ============================================================

    for (const side of [-1, 1]) {
      const z = side * 5.02;

      addBeam(
        new THREE.Vector3(-75, 1.13, z),
        new THREE.Vector3(75, 1.13, z),
        0.10,
        0.10,
        railingMat
      );

      addBeam(
        new THREE.Vector3(-75, 0.68, z),
        new THREE.Vector3(75, 0.68, z),
        0.07,
        0.07,
        railingMat
      );

      for (let x = -75; x <= 75; x += 3) {
        addCylinderBetween(
          new THREE.Vector3(x, 0.27, z),
          new THREE.Vector3(x, 1.13, z),
          0.030,
          railingMat
        );
      }
    }

    // ============================================================
    // 14. LAMPU JALAN
    // ============================================================

    function addLamp(x, side) {
      const z = side * 4.70;

      addCylinderBetween(
        new THREE.Vector3(x, 0.36, z),
        new THREE.Vector3(x, 3.10, z),
        0.048,
        lampMat
      );

      const top = new THREE.Vector3(x, 3.10, z);
      const end = new THREE.Vector3(x, 3.15, z - side * 0.70);

      addCylinderBetween(top, end, 0.040, lampMat);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.10, 0.18),
        lampMat
      );
      head.position.copy(end);
      head.position.z -= side * 0.12;
      head.castShadow = true;
      bridge.add(head);
    }

    for (let x = -67.5; x <= 67.5; x += 15) {
      addLamp(x, -1);
      if (x + 7.5 <= 75) addLamp(x + 7.5, 1);
    }

    // ============================================================
    // 15. ABUTMENT UJUNG DECK
    // ============================================================

    for (const x of [-73.2, 73.2]) {
      const abutment = new THREE.Mesh(
        new THREE.BoxGeometry(5.0, 4.6, 11.6),
        concreteMat
      );
      abutment.position.set(x, -2.75, 0);
      abutment.castShadow = true;
      abutment.receiveShadow = true;
      bridge.add(abutment);
    }

    // ============================================================
    // 16. MOBIL 3D SEDERHANA + ANIMASI
    // ============================================================

    const cars = [];

    function createCar(color, x, laneZ, direction, speed) {
      const car = new THREE.Group();

      const paint = new THREE.MeshStandardMaterial({
        color,
        metalness: 0.20,
        roughness: 0.42
      });

      const glass = new THREE.MeshStandardMaterial({
        color: 0x23384a,
        metalness: 0.15,
        roughness: 0.22
      });

      const tireMat = new THREE.MeshStandardMaterial({
        color: 0x181818,
        roughness: 0.96
      });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(3.6, 0.62, 1.62),
        paint
      );
      body.position.y = 0.55;
      body.castShadow = true;
      car.add(body);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.85, 0.68, 1.38),
        paint
      );
      cabin.position.set(-0.10, 1.02, 0);
      cabin.castShadow = true;
      car.add(cabin);

      const windscreen = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.46, 1.16),
        glass
      );
      windscreen.position.set(direction > 0 ? 0.84 : -0.84, 1.03, 0);
      car.add(windscreen);

      const wheelPositions = [
        [-1.08, -0.72],
        [-1.08,  0.72],
        [ 1.08, -0.72],
        [ 1.08,  0.72]
      ];

      for (const [wx, wz] of wheelPositions) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.30, 0.30, 0.22, 14),
          tireMat
        );
        wheel.rotation.x = Math.PI / 2;
        wheel.position.set(wx, 0.31, wz);
        wheel.castShadow = true;
        car.add(wheel);
      }

      car.position.set(x, DECK_Y + 0.20, laneZ);
      if (direction < 0) car.rotation.y = Math.PI;

      car.userData.direction = direction;
      car.userData.speed = speed;

      bridge.add(car);
      cars.push(car);
    }

    // Dua arah.
    createCar(0xd62828, -60, -1.75,  1, 10.0);
    createCar(0x2563eb, -12, -1.75,  1, 8.2);
    createCar(0xf59e0b,  46,  1.75, -1, 9.0);
    createCar(0xffffff,  75,  1.75, -1, 10.4);

    // ============================================================
    // 17. AIR / TANAH / APPROACH
    // ============================================================

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(130, 170),
      waterMat
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, -7.0, 0);
    water.receiveShadow = true;
    scene.add(water);

    function addLand(x, width) {
      const land = new THREE.Mesh(
        new THREE.PlaneGeometry(width, 180),
        landMat
      );
      land.rotation.x = -Math.PI / 2;
      land.position.set(x, -6.82, 0);
      land.receiveShadow = true;
      scene.add(land);
    }

    addLand(-108, 92);
    addLand(108, 92);

    for (const x of [-104, 104]) {
      const road = new THREE.Mesh(
        new THREE.BoxGeometry(58, 0.12, 8.45),
        asphaltMat
      );
      road.position.set(x, 0.04, 0);
      road.receiveShadow = true;
      scene.add(road);

      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(57, 0.025, 0.10),
        yellowPaintMat
      );
      stripe.position.set(x, 0.115, 0);
      scene.add(stripe);
    }

    function addContourSet(side) {
      const baseX = side < 0 ? -142 : 142;

      for (let i = 0; i < 10; i++) {
        const x0 = baseX - side * i * 5.0;
        const y = -6.67 + i * 0.025;

        const points = [
          new THREE.Vector3(x0, y, -82),
          new THREE.Vector3(x0 + side * 4, y, -52),
          new THREE.Vector3(x0 + side * 10, y, -22),
          new THREE.Vector3(x0 + side * 12, y, 8),
          new THREE.Vector3(x0 + side * 8, y, 38),
          new THREE.Vector3(x0 + side * 2, y, 82)
        ];

        const geo = new THREE.BufferGeometry().setFromPoints(points);
        scene.add(new THREE.Line(geo, contourMat));
      }
    }

    addContourSet(-1);
    addContourSet(1);

    // ============================================================
    // 18. ANIMATION
    // ============================================================

    const clock = new THREE.Clock();
    let trafficRunning = true;

    function updateCars(delta) {
      if (!trafficRunning) return;

      const minX = -126;
      const maxX = 126;

      for (const car of cars) {
        car.position.x += car.userData.direction * car.userData.speed * delta;

        if (car.userData.direction > 0 && car.position.x > maxX) {
          car.position.x = minX;
        }

        if (car.userData.direction < 0 && car.position.x < minX) {
          car.position.x = maxX;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      updateCars(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // ============================================================
    // 19. BUTTON
    // ============================================================

    document.getElementById("resetCamera").addEventListener("click", () => {
      camera.position.set(118, 56, 92);
      controls.target.set(0, 1.4, 0);
      controls.update();
    });

    const trafficButton = document.getElementById("toggleTraffic");

    trafficButton.addEventListener("click", () => {
      trafficRunning = !trafficRunning;
      trafficButton.textContent = trafficRunning ? "Pause mobil" : "Jalankan mobil";
    });

    // ============================================================
    // 20. RESIZE
    // ============================================================

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
