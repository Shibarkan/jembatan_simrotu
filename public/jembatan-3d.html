<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jembatan Sirotu </title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef2f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      top: 18px;
      left: 22px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 8px 30px rgba(15,23,42,.08);
      backdrop-filter: blur(10px);
    }

    #overlay h1 {
      margin: 0;
      color: #b91c1c;
      font-size: 16px;
      line-height: 1;
      letter-spacing: .14em;
      font-weight: 900;
    }

    #overlay p {
      margin: 7px 0 10px;
      color: #475569;
      font-size: 11px;
    }

    #overlay .buttons {
      display: flex;
      gap: 7px;
    }

    #overlay button {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      background: #b91c1c;
      color: #fff;
    }

    #overlay button.secondary {
      background: #e5e7eb;
      color: #334155;
    }

    #overlay button.active {
      background: #0f766e;
      color: #fff;
    }

    #exploreHud {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 10;
      display: none;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .78);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(15,23,42,.16);
      user-select: none;
    }

    #exploreHud.show { display: block; }
  </style>
</head>

<body>
  <div id="overlay">
    <h1>JEMBATAN SIROTU </h1>
    <p id="controlHint">Drag: putar · Scroll: zoom · Klik kanan: geser </p>
    <div class="buttons">
      <button id="resetCamera">Reset kamera</button>
      <button id="toggleExplore">Mode Orang</button>
      <button id="toggleTraffic" class="secondary">Pause kendaraan</button>
    </div>
  </div>
  <div id="exploreHud">W/S atau ↑/↓: maju-mundur · A/D atau ←/→: belok · Shift: lari · ESC: keluar mode orang</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    // ============================================================
    // 1. SCENE / CAMERA / RENDERER
    // ============================================================

    const scene = new THREE.Scene();
    // Atmospheric fog is intentionally close to the horizon color so distant
    // hills fade naturally instead of ending in a hard 3D edge.
    scene.background = new THREE.Color(0xbccbd0);
    scene.fog = new THREE.FogExp2(0xb8c4c0, 0.00325);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(118, 56, 92);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.4, 0);
    controls.minDistance = 48;
    controls.maxDistance = 280;
    controls.maxPolarAngle = Math.PI * 0.495;

    // Subtle cinematic post processing: enough glow for lamps/headlights and
    // bright sun reflections, without turning the bridge into a neon scene.
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.18,
      0.45,
      0.90
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // ============================================================
    // 2. LIGHT
    // ============================================================

    scene.add(new THREE.HemisphereLight(0xfff4dc, 0x536b58, 1.65));

    const sun = new THREE.DirectionalLight(0xffe2b8, 3.15);
    sun.position.set(-95, 82, 92);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.left = -140;
    sun.shadow.camera.right = 140;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 320;
    scene.add(sun);

    // Warm bounce light from the sky/horizon.
    const warmFill = new THREE.DirectionalLight(0xffc98d, 0.42);
    warmFill.position.set(110, 35, -120);
    scene.add(warmFill);

    // ============================================================
    // 3. MATERIAL
    // ============================================================

    const steelRed = new THREE.MeshStandardMaterial({
      color: 0xf23832,
      metalness: 0.24,
      roughness: 0.42
    });

    const steelDark = new THREE.MeshStandardMaterial({
      color: 0xc72525,
      metalness: 0.32,
      roughness: 0.42
    });

    const hangerMat = new THREE.MeshStandardMaterial({
      color: 0xc5a632,
      metalness: 0.48,
      roughness: 0.36
    });

    const asphaltMat = new THREE.MeshStandardMaterial({
      color: 0x27292b,
      roughness: 0.96
    });

    const concreteMat = new THREE.MeshStandardMaterial({
      color: 0xc8c8c2,
      roughness: 0.88
    });

    const sidewalkMat = new THREE.MeshStandardMaterial({
      color: 0xe7e4dc,
      roughness: 0.86
    });

    const whitePaintMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.72
    });

    const yellowPaintMat = new THREE.MeshStandardMaterial({
      color: 0xf1cf12,
      roughness: 0.70
    });

    const railingMat = new THREE.MeshStandardMaterial({
      color: 0xe4a0a0,
      metalness: 0.18,
      roughness: 0.50
    });

    const lampMat = new THREE.MeshStandardMaterial({
      color: 0xd7ddda,
      metalness: 0.55,
      roughness: 0.34
    });

    const bearingMat = new THREE.MeshStandardMaterial({
      color: 0x3f4449,
      metalness: 0.72,
      roughness: 0.26
    });

    const boltMat = new THREE.MeshStandardMaterial({
      color: 0x9ca3a8,
      metalness: 0.86,
      roughness: 0.20
    });

    const waterMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uSunDir: { value: new THREE.Vector3(-0.45, 0.72, 0.52).normalize() },
        uDeep: { value: new THREE.Color(0x164f61) },
        uShallow: { value: new THREE.Color(0x4ba9b8) },
        uSky: { value: new THREE.Color(0xcad9dc) }
      },
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos;
        varying vec2 vUv2;
        void main() {
          vec3 p = position;
          float w1 = sin(p.x * 0.115 + uTime * 0.72) * 0.055;
          float w2 = cos(p.y * 0.092 - uTime * 0.52) * 0.040;
          float w3 = sin((p.x + p.y) * 0.052 + uTime * 0.34) * 0.028;
          p.z += w1 + w2 + w3;
          vec4 world = modelMatrix * vec4(p, 1.0);
          vWorldPos = world.xyz;
          vUv2 = uv;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform vec3 uSunDir;
        uniform vec3 uDeep;
        uniform vec3 uShallow;
        uniform vec3 uSky;
        varying vec3 vWorldPos;
        varying vec2 vUv2;
        void main() {
          vec3 dx = dFdx(vWorldPos);
          vec3 dy = dFdy(vWorldPos);
          vec3 n = normalize(cross(dx, dy));
          if (n.y < 0.0) n = -n;
          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          float fresnel = pow(1.0 - clamp(dot(viewDir, n), 0.0, 1.0), 3.0);
          float ripple = 0.5 + 0.5 * sin(vUv2.x * 125.0 + vUv2.y * 75.0);
          vec3 base = mix(uDeep, uShallow, 0.42 + ripple * 0.06);
          vec3 col = mix(base, uSky, fresnel * 0.62);
          vec3 reflected = reflect(-uSunDir, n);
          float spec = pow(max(dot(reflected, viewDir), 0.0), 120.0);
          col += vec3(1.0, 0.72, 0.43) * spec * 1.45;
          float haze = smoothstep(115.0, 280.0, length(vWorldPos.xz));
          col = mix(col, uSky, haze * 0.30);
          gl_FragColor = vec4(col, 0.96);
        }
      `,
      transparent: true,
      depthWrite: true
    });

    const landMat = new THREE.MeshStandardMaterial({
      color: 0x748d57,
      roughness: 1.0
    });

    const contourMat = new THREE.LineBasicMaterial({
      color: 0x40583a,
      transparent: true,
      opacity: 0.60
    });

    const hillMat = new THREE.MeshStandardMaterial({
      color: 0x5f7757,
      roughness: 1.0
    });

    const hillFarMat = new THREE.MeshStandardMaterial({
      color: 0x728574,
      roughness: 1.0
    });

    const trunkMat = new THREE.MeshStandardMaterial({
      color: 0x5a3d2c,
      roughness: 1.0
    });

    const leafMats = [
      new THREE.MeshStandardMaterial({ color: 0x31583c, roughness: 1.0 }),
      new THREE.MeshStandardMaterial({ color: 0x446b45, roughness: 1.0 }),
      new THREE.MeshStandardMaterial({ color: 0x58784a, roughness: 1.0 })
    ];

    const rockMat = new THREE.MeshStandardMaterial({
      color: 0x7f8581,
      roughness: 1.0
    });

    const warmGlowMat = new THREE.MeshBasicMaterial({
      color: 0xffd18a,
      transparent: true,
      opacity: 0.86
    });

    // ============================================================
    // 3B. PROCEDURAL SURFACE TEXTURES (NO EXTERNAL IMAGE FILES)
    // ============================================================

    function makeNoiseTexture(baseHex, grain = 34, lineChance = 0.0) {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const base = new THREE.Color(baseHex);
      const img = ctx.createImageData(size, size);
      let seed = 9173;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const n = (rand() - 0.5) * grain;
          const streak = rand() < lineChance ? -22 : 0;
          img.data[i] = Math.max(0, Math.min(255, base.r * 255 + n + streak));
          img.data[i+1] = Math.max(0, Math.min(255, base.g * 255 + n + streak));
          img.data[i+2] = Math.max(0, Math.min(255, base.b * 255 + n + streak));
          img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    const asphaltTex = makeNoiseTexture(0x292b2d, 42, 0.0025);
    asphaltTex.repeat.set(32, 3);
    asphaltMat.map = asphaltTex;
    asphaltMat.color.set(0xffffff);
    asphaltMat.roughness = 0.91;

    const concreteTex = makeNoiseTexture(0xbfc0b9, 28, 0.0009);
    concreteTex.repeat.set(18, 4);
    concreteMat.map = concreteTex;
    concreteMat.color.set(0xffffff);

    const sidewalkTex = makeNoiseTexture(0xdedbd1, 20, 0.0005);
    sidewalkTex.repeat.set(24, 2);
    sidewalkMat.map = sidewalkTex;
    sidewalkMat.color.set(0xffffff);

    // ============================================================
    // 3C. CINEMATIC SKY DOME + CLOUDS
    // ============================================================

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTop: { value: new THREE.Color(0x6f93a8) },
        uHorizon: { value: new THREE.Color(0xe8c7a7) },
        uLower: { value: new THREE.Color(0xd8d8c5) },
        uSunDirection: { value: new THREE.Vector3(-0.46, 0.27, -0.84).normalize() }
      },
      vertexShader: `
        varying vec3 vDir;
        void main(){
          vec4 world = modelMatrix * vec4(position,1.0);
          vDir = normalize(world.xyz - cameraPosition);
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform vec3 uTop;
        uniform vec3 uHorizon;
        uniform vec3 uLower;
        uniform vec3 uSunDirection;
        varying vec3 vDir;
        void main(){
          float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
          vec3 col = mix(uLower, uHorizon, smoothstep(0.16, 0.52, h));
          col = mix(col, uTop, smoothstep(0.50, 0.92, h));
          float sunDot = max(dot(normalize(vDir), normalize(uSunDirection)), 0.0);
          float halo = pow(sunDot, 18.0) * 0.60;
          float disc = pow(sunDot, 950.0) * 5.0;
          col += vec3(1.0,0.55,0.24) * halo + vec3(1.0,0.84,0.55) * disc;
          gl_FragColor = vec4(col,1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(470, 48, 24), skyMat);
    scene.add(skyDome);

    function makeCloudTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,c.width,c.height);
      const blobs = [[78,72,55],[120,54,48],[158,73,58],[110,82,66],[190,78,38]];
      for (const [x,y,r] of blobs) {
        const g = ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,'rgba(255,247,236,.70)');
        g.addColorStop(.55,'rgba(244,236,224,.30)');
        g.addColorStop(1,'rgba(239,231,218,0)');
        ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const cloudTex = makeCloudTexture();
    const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.52, depthWrite: false, fog: true });
    const clouds = [];
    [
      [-120,58,-210,46,20],[-28,72,-235,58,25],[78,54,-220,50,22],[155,68,-188,44,18],
      [-170,48,85,38,16],[145,60,105,42,18]
    ].forEach(([x,y,z,sx,sy]) => {
      const sp = new THREE.Sprite(cloudMat.clone());
      sp.position.set(x,y,z); sp.scale.set(sx,sy,1); scene.add(sp); clouds.push(sp);
    });

    // ============================================================
    // 4. DIMENSI UTAMA
    // ============================================================

    // Koordinat model dipusatkan di tengah jembatan:
// STA 0 = x -75, STA 25 = x -50, STA 125 = x +50, STA 150 = x +75.
    const BRIDGE_LENGTH = 150;
    const DECK_WIDTH = 10;
    const DECK_Y = 0;

    const ARCH_START = -50; // STA 25 m
    const ARCH_END = 50; // STA 125 m
    const ARCH_SPRING_Y = -3.80; // diturunkan lagi
    const ARCH_RISE = 17.65; // menjaga elevasi puncak arch tetap hampir sama
    const ARCH_BASE_HALF_WIDTH = 6.05;
    const ARCH_TILT = THREE.MathUtils.degToRad(10);

    const bridge = new THREE.Group();
    scene.add(bridge);

    // ============================================================
    // 5. HELPER
    // ============================================================

    function addBeam(p1, p2, height, width, material, parent = bridge) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(length, height, width),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(1, 0, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinderBetween(p1, p2, radius, material, parent = bridge, segments = 10) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function archY(x) {
      const t = (x - ARCH_START) / (ARCH_END - ARCH_START);
      if (t < 0 || t > 1) return ARCH_SPRING_Y;
      return ARCH_SPRING_Y + ARCH_RISE * 4 * t * (1 - t);
    }

    function archZ(x, side) {
      const y = archY(x);
      const inward = Math.tan(ARCH_TILT) * Math.max(0, y - ARCH_SPRING_Y);
      return side * Math.max(2.95, ARCH_BASE_HALF_WIDTH - inward);
    }

    function archPoint(x, side) {
      return new THREE.Vector3(x, archY(x), archZ(x, side));
    }

    // ============================================================
    // 6. DECK / ROAD
    // ============================================================

    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, DECK_WIDTH + 1.0),
      concreteMat
    );
    slab.position.y = DECK_Y - 0.31;
    slab.castShadow = true;
    slab.receiveShadow = true;
    bridge.add(slab);

    const asphalt = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.16, 7.15),
      asphaltMat
    );
    asphalt.position.set(0, DECK_Y + 0.095, 0);
    asphalt.receiveShadow = true;
    bridge.add(asphalt);

    for (const side of [-1, 1]) {
      const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.24, 1.2),
        sidewalkMat
      );
      sidewalk.position.set(0, DECK_Y + 0.14, side * 4.45);
      sidewalk.castShadow = true;
      sidewalk.receiveShadow = true;
      bridge.add(sidewalk);
    }

    const centerLine = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.032, 0.10),
      yellowPaintMat
    );
    centerLine.position.set(0, DECK_Y + 0.195, 0);
    bridge.add(centerLine);

    for (const z of [-3.36, 3.36]) {
      const edgeLine = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.026, 0.075),
        whitePaintMat
      );
      edgeLine.position.set(0, DECK_Y + 0.196, z);
      bridge.add(edgeLine);
    }

    for (const side of [-1, 1]) {
      const edgeGirder = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, 0.34),
        steelRed
      );
      edgeGirder.position.set(0, DECK_Y - 0.60, side * 5.20);
      edgeGirder.castShadow = true;
      bridge.add(edgeGirder);
    }

    // ============================================================
    // 7. MAIN ARCH RIBS
    // ============================================================

    const archStations = [];
    for (let x = ARCH_START; x <= ARCH_END; x += 2) {
      archStations.push(x);
    }
    if (archStations[archStations.length - 1] !== ARCH_END) {
      archStations.push(ARCH_END);
    }

    for (const side of [-1, 1]) {
      for (let i = 0; i < archStations.length - 1; i++) {
        addBeam(
          archPoint(archStations[i], side),
          archPoint(archStations[i + 1], side),
          0.58,
          0.68,
          steelRed
        );
      }
    }

    // ============================================================
    // 8. HANGERS
    // ============================================================

    for (let x = -48; x <= 48; x += 6) {
      for (const side of [-1, 1]) {
        const top = archPoint(x, side);
        const bottom = new THREE.Vector3(x, DECK_Y + 0.30, side * 5.02);

        if (top.y > bottom.y + 0.6) {
          addCylinderBetween(bottom, top, 0.055, hangerMat);
        }
      }
    }

    // ============================================================
    // 9. BRACING ATAS - HANYA GARIS MELINTANG, TANPA X / DIAGONAL
    // ============================================================

    const topCrossStations = [-37, -29, -21, -13, -5, 5, 13, 21, 29, 37];

    for (const x of topCrossStations) {
      addBeam(
        archPoint(x, -1),
        archPoint(x, 1),
        0.20,
        0.24,
        steelDark
      );
    }

    // ============================================================
    // 10. FLOOR SYSTEM
    // ============================================================

    for (let x = -72.5; x <= 72.5; x += 5) {
      addBeam(
        new THREE.Vector3(x, DECK_Y - 0.72, -5.35),
        new THREE.Vector3(x, DECK_Y - 0.72, 5.35),
        0.30,
        0.34,
        steelDark
      );
    }

    // Side truss di bawah deck.
    for (const side of [-1, 1]) {
      const z = side * 5.22;
      const upperY = DECK_Y - 0.50;
      const lowerY = DECK_Y - 1.62;

      addBeam(
        new THREE.Vector3(-75, lowerY, z),
        new THREE.Vector3(75, lowerY, z),
        0.25,
        0.28,
        steelRed
      );

      for (let x = -75; x < 75; x += 5) {
        const nextX = Math.min(x + 5, 75);

        addBeam(
          new THREE.Vector3(x, upperY, z),
          new THREE.Vector3(x, lowerY, z),
          0.18,
          0.18,
          steelDark
        );

        const alternate = Math.floor((x + 75) / 5) % 2 === 0;

        if (alternate) {
          addBeam(
            new THREE.Vector3(x, lowerY, z),
            new THREE.Vector3(nextX, upperY, z),
            0.16,
            0.16,
            steelDark
          );
        } else {
          addBeam(
            new THREE.Vector3(x, upperY, z),
            new THREE.Vector3(nextX, lowerY, z),
            0.16,
            0.16,
            steelDark
          );
        }
      }
    }

    function createNut(position) {

    function createArchBearing(x, side) {
      const base = archPoint(x, side);
      const z = base.z;

      // Pedestal beton tumpuan.
      // Permukaan air berada di y = -7.0.
      // Dasar pedestal dibuat sampai y = -8.25 agar bagian bawah
      // tumpuan tampak sedikit tenggelam di air.
      const WATER_LEVEL_Y = -7.0;
      const PEDESTAL_BOTTOM_Y = -8.75;
      const PEDESTAL_TOP_Y = ARCH_SPRING_Y - 0.28;
      const pedestalHeight = PEDESTAL_TOP_Y - PEDESTAL_BOTTOM_Y;

      const pedestal = new THREE.Mesh(
        new THREE.BoxGeometry(3.8, pedestalHeight, 3.2),
        concreteMat
      );

      pedestal.position.set(
        x,
        (PEDESTAL_TOP_Y + PEDESTAL_BOTTOM_Y) / 2,
        z
      );

      pedestal.castShadow = true;
      pedestal.receiveShadow = true;
      bridge.add(pedestal);

      // Collar tipis tepat di garis air supaya efek "masuk air"
      // terlihat jelas saat kamera diputar.
      const waterlineCollar = new THREE.Mesh(
        new THREE.BoxGeometry(3.95, 0.08, 3.35),
        bearingMat
      );

      waterlineCollar.position.set(
        x,
        WATER_LEVEL_Y + 0.03,
        z
      );

      waterlineCollar.castShadow = true;
      bridge.add(waterlineCollar);

      // Base plate.
      const basePlate = new THREE.Mesh(
        new THREE.BoxGeometry(3.4, 0.24, 2.8),
        bearingMat
      );
      basePlate.position.set(x, ARCH_SPRING_Y - 0.31, z);
      basePlate.castShadow = true;
      bridge.add(basePlate);

      // Dua plate tegak yang memegang pin.
      for (const dz of [-0.70, 0.70]) {
        const cheekPlate = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.25, 0.16),
          steelDark
        );
        cheekPlate.position.set(x, ARCH_SPRING_Y + 0.30, z + dz);
        cheekPlate.rotation.z = x < 0
          ? THREE.MathUtils.degToRad(-15)
          : THREE.MathUtils.degToRad(15);
        cheekPlate.castShadow = true;
        bridge.add(cheekPlate);
      }

      // Pin tumpuan melintang.
      addCylinderBetween(
        new THREE.Vector3(x, ARCH_SPRING_Y + 0.32, z - 0.95),
        new THREE.Vector3(x, ARCH_SPRING_Y + 0.32, z + 0.95),
        0.18,
        boltMat
      );

      // 4 anchor bolt + mur.
      const boltOffsets = [
        [-0.82, -0.62],
        [-0.82,  0.62],
        [ 0.82, -0.62],
        [ 0.82,  0.62]
      ];

      for (const [dx, dz] of boltOffsets) {
        const bolt = new THREE.Mesh(
          new THREE.CylinderGeometry(0.07, 0.07, 0.65, 10),
          boltMat
        );
        bolt.position.set(x + dx, ARCH_SPRING_Y + 0.02, z + dz);
        bolt.castShadow = true;
        bridge.add(bolt);

        createNut(
          new THREE.Vector3(
            x + dx,
            ARCH_SPRING_Y + 0.36,
            z + dz
          )
        );
      }
    }

    // Empat kaki arch.
    for (const x of [ARCH_START, ARCH_END]) {
      for (const side of [-1, 1]) {
        createArchBearing(x, side);
      }

      const tire = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 18), tireMat);

    const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.54, 4, 8), skinMat);
    const armR = armL.clone();
    armL.position.set(-0.31, 1.25, 0); armR.position.set(0.31, 1.25, 0);
    avatar.add(armL, armR);

    avatar.position.set(-96, 0.16, 3.0);
    avatar.rotation.y = Math.PI / 2;
    avatar.visible = false;
    scene.add(avatar);

    let exploreMode = false;
    const keyState = Object.create(null);
    let walkPhase = 0;

    function setExploreMode(enabled) {
      exploreMode = enabled;
      avatar.visible = enabled;
      controls.enabled = !enabled;
      const btn = document.getElementById('toggleExplore');
      const hud = document.getElementById('exploreHud');
      const hint = document.getElementById('controlHint');
      btn.textContent = enabled ? 'Keluar Mode Orang' : 'Mode Orang';
      btn.classList.toggle('active', enabled);
      hud.classList.toggle('show', enabled);
      hint.textContent = enabled
        ? 'Kamu sedang berjalan di jembatan — gunakan keyboard'
        : 'Drag: putar · Scroll: zoom · Klik kanan: geser · Ultra graphics';

      if (enabled) {
        camera.position.set(avatar.position.x - 7, 4.6, avatar.position.z + 7);
        camera.lookAt(avatar.position.x, 1.3, avatar.position.z);
      }
    }

    function updateExplore(delta) {
      if (!exploreMode) return;

      const turn = 1.65 * delta;
      if (keyState['a'] || keyState['arrowleft']) avatar.rotation.y += turn;
      if (keyState['d'] || keyState['arrowright']) avatar.rotation.y -= turn;

      let move = 0;
      if (keyState['w'] || keyState['arrowup']) move += 1;
      if (keyState['s'] || keyState['arrowdown']) move -= 1;

      const running = keyState['shift'];
      const speed = running ? 8.0 : 4.2;
      if (move !== 0) {
        avatar.position.x += Math.sin(avatar.rotation.y) * move * speed * delta;
        avatar.position.z += Math.cos(avatar.rotation.y) * move * speed * delta;

        // Area jelajah dibuat aman di sepanjang approach + deck.
        avatar.position.x = THREE.MathUtils.clamp(avatar.position.x, -126, 126);
        avatar.position.z = THREE.MathUtils.clamp(avatar.position.z, -4.1, 4.1);
        avatar.position.y = 0.16;

        walkPhase += delta * (running ? 13 : 8);
        const swing = Math.sin(walkPhase) * 0.42;
        legL.rotation.x = swing;
        legR.rotation.x = -swing;
        armL.rotation.x = -swing * 0.75;
        armR.rotation.x = swing * 0.75;
        torso.position.y = 1.18 + Math.abs(Math.sin(walkPhase*2)) * 0.025;
      } else {
        legL.rotation.x *= 0.78; legR.rotation.x *= 0.78;
        armL.rotation.x *= 0.78; armR.rotation.x *= 0.78;
      }

      const back = new THREE.Vector3(-Math.sin(avatar.rotation.y), 0, -Math.cos(avatar.rotation.y));
      const desired = avatar.position.clone().add(back.multiplyScalar(6.5));
      desired.y += 4.0;
      camera.position.lerp(desired, 1 - Math.pow(0.0008, delta));
      camera.lookAt(avatar.position.x, avatar.position.y + 1.25, avatar.position.z);
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)) {
        keyState[k] = true;
        if (exploreMode) e.preventDefault();
      }
      if (e.key === 'Escape' && exploreMode) setExploreMode(false);
    });

    window.addEventListener('keyup', (e) => {
      keyState[e.key.toLowerCase()] = false;
    });

    // ============================================================
    // 18. ANIMATION
    // ============================================================

    const clock = new THREE.Clock();
    let trafficRunning = true;

    function updateCars(delta) {
      if (!trafficRunning) return;

      const minX = -126;
      const maxX = 126;

      for (const car of cars) {
        car.position.x += car.userData.direction * car.userData.speed * delta;

        if (car.userData.direction > 0 && car.position.x > maxX) {
          car.position.x = minX;
        }

        if (car.userData.direction < 0 && car.position.x < minX) {
          car.position.x = maxX;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      updateCars(delta);
      updateExplore(delta);

      const t = clock.elapsedTime;
      waterMat.uniforms.uTime.value = t;
      motes.rotation.y = t * 0.004;
      for (let i = 0; i < clouds.length; i++) {
        clouds[i].position.x += Math.sin(t * 0.03 + i) * 0.0015;
      }

      controls.update();
      composer.render();
    }

    animate();

    // ============================================================
    // 19. BUTTON
    // ============================================================

    document.getElementById("resetCamera").addEventListener("click", () => {
      if (exploreMode) setExploreMode(false);
      camera.position.set(118, 56, 92);
      controls.target.set(0, 1.4, 0);
      controls.update();
    });

    document.getElementById("toggleExplore").addEventListener("click", () => {
      setExploreMode(!exploreMode);
    });

    const trafficButton = document.getElementById("toggleTraffic");

    trafficButton.addEventListener("click", () => {
      trafficRunning = !trafficRunning;
      trafficButton.textContent = trafficRunning ? "Pause kendaraan" : "Jalankan kendaraan";
    });

    // ============================================================
    // 20. RESIZE
    // ============================================================

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
