<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jembatan Sirotu - Visualisasi 3D</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef2f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      top: 18px;
      left: 22px;
      z-index: 10;
      pointer-events: none;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 8px 30px rgba(15,23,42,.08);
      backdrop-filter: blur(10px);
    }

    #overlay h1 {
      margin: 0;
      color: #b91c1c;
      font-size: 16px;
      line-height: 1;
      letter-spacing: .14em;
      font-weight: 900;
    }

    #overlay p {
      margin: 7px 0 0;
      color: #475569;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <h1>JEMBATAN SIROTU</h1>
    <p>Drag: putar · Scroll: zoom · Klik kanan: geser</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ============================================================
    // 1. SCENE / CAMERA / RENDERER
    // ============================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeef2f3);
    scene.fog = new THREE.Fog(0xeef2f3, 170, 360);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    // Sudut awal dibuat mendekati render perspektif pada PDF.
    camera.position.set(118, 57, 92);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.5, 0);
    controls.minDistance = 55;
    controls.maxDistance = 260;
    controls.maxPolarAngle = Math.PI * 0.49;

    // ============================================================
    // 2. LIGHTING
    // ============================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x7c8d72, 1.8));

    const sun = new THREE.DirectionalLight(0xffffff, 3.0);
    sun.position.set(-70, 100, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -130;
    sun.shadow.camera.right = 130;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 300;
    scene.add(sun);

    // ============================================================
    // 3. MATERIAL
    // ============================================================

    const steelRed = new THREE.MeshStandardMaterial({
      color: 0xf23832,
      metalness: 0.24,
      roughness: 0.42
    });

    const steelRedDark = new THREE.MeshStandardMaterial({
      color: 0xcc2525,
      metalness: 0.30,
      roughness: 0.46
    });

    const hangerMat = new THREE.MeshStandardMaterial({
      color: 0xc7a82d,
      metalness: 0.45,
      roughness: 0.42
    });

    const asphaltMat = new THREE.MeshStandardMaterial({
      color: 0x27292b,
      roughness: 0.95
    });

    const concreteMat = new THREE.MeshStandardMaterial({
      color: 0xc9c9c5,
      roughness: 0.85
    });

    const sidewalkMat = new THREE.MeshStandardMaterial({
      color: 0xe9e7e0,
      roughness: 0.85
    });

    const whitePaintMat = new THREE.MeshStandardMaterial({
      color: 0xf8fafc,
      roughness: 0.75
    });

    const yellowPaintMat = new THREE.MeshStandardMaterial({
      color: 0xf2d30f,
      roughness: 0.68
    });

    const railingMat = new THREE.MeshStandardMaterial({
      color: 0xe9a2a2,
      metalness: 0.16,
      roughness: 0.52
    });

    const lampMat = new THREE.MeshStandardMaterial({
      color: 0xd7ddd8,
      metalness: 0.55,
      roughness: 0.35
    });

    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x16b8df,
      roughness: 0.2,
      metalness: 0.02,
      transparent: true,
      opacity: 0.92
    });

    const landMat = new THREE.MeshStandardMaterial({
      color: 0x718b55,
      roughness: 1.0
    });

    const contourMat = new THREE.LineBasicMaterial({
      color: 0x3f5638,
      transparent: true,
      opacity: 0.62
    });

    // ============================================================
    // 4. DIMENSI UTAMA
    // ============================================================

    // Mengacu proporsi gambar teknik: panjang total 150 m dan lebar sekitar 10 m.
    const BRIDGE_LENGTH = 150;
    const DECK_WIDTH = 10;
    const DECK_Y = 0;

    // Arch tidak dibuat setengah lingkaran.
    // Springing sedikit di bawah lantai dan puncak sekitar elevasi +14 m.
    const ARCH_START = -58;
    const ARCH_END = 58;
    const ARCH_SPRING_Y = -3.4;
    const ARCH_RISE = 18.0;

    // Dua rib arch dimiringkan ke arah dalam.
    const ARCH_BASE_HALF_WIDTH = 6.15;
    const ARCH_TILT = THREE.MathUtils.degToRad(10);

    const bridge = new THREE.Group();
    scene.add(bridge);

    // ============================================================
    // 5. HELPER - BALOK ANTAR DUA TITIK
    // ============================================================

    function addBeam(p1, p2, height, width, material, parent = bridge) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const geometry = new THREE.BoxGeometry(length, height, width);
      const mesh = new THREE.Mesh(geometry, material);

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(1, 0, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinderBetween(p1, p2, radius, material, parent = bridge) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();

      const geometry = new THREE.CylinderGeometry(
        radius,
        radius,
        length,
        10
      );

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(a).add(b).multiplyScalar(0.5);

      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir.normalize()
      );

      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function archY(x) {
      const t = (x - ARCH_START) / (ARCH_END - ARCH_START);
      if (t < 0 || t > 1) return ARCH_SPRING_Y;

      return ARCH_SPRING_Y + ARCH_RISE * 4 * t * (1 - t);
    }

    function archZ(x, side) {
      const y = archY(x);
      const inward = Math.tan(ARCH_TILT) * Math.max(0, y - ARCH_SPRING_Y);

      return side * Math.max(
        2.75,
        ARCH_BASE_HALF_WIDTH - inward
      );
    }

    function archPoint(x, side) {
      return new THREE.Vector3(
        x,
        archY(x),
        archZ(x, side)
      );
    }

    // ============================================================
    // 6. DECK / ROAD
    // ============================================================

    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.65, DECK_WIDTH + 1.0),
      concreteMat
    );
    slab.position.y = DECK_Y - 0.30;
    slab.castShadow = true;
    slab.receiveShadow = true;
    bridge.add(slab);

    const asphalt = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH, 0.16, 7.2),
      asphaltMat
    );
    asphalt.position.set(0, DECK_Y + 0.105, 0);
    asphalt.receiveShadow = true;
    bridge.add(asphalt);

    // Trotoar kiri dan kanan
    for (const side of [-1, 1]) {
      const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.24, 1.2),
        sidewalkMat
      );

      sidewalk.position.set(
        0,
        DECK_Y + 0.14,
        side * 4.45
      );

      sidewalk.castShadow = true;
      sidewalk.receiveShadow = true;
      bridge.add(sidewalk);
    }

    // Marka tengah kuning
    const centerLine = new THREE.Mesh(
      new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.035, 0.10),
      yellowPaintMat
    );
    centerLine.position.set(0, DECK_Y + 0.205, 0);
    bridge.add(centerLine);

    // Marka tepi jalan putih
    for (const z of [-3.38, 3.38]) {
      const edgeLine = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH - 1, 0.03, 0.08),
        whitePaintMat
      );
      edgeLine.position.set(0, DECK_Y + 0.205, z);
      bridge.add(edgeLine);
    }

    // Gelagar tepi merah di sepanjang sisi dek
    for (const side of [-1, 1]) {
      const edgeGirder = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_LENGTH, 0.62, 0.34),
        steelRed
      );
      edgeGirder.position.set(
        0,
        DECK_Y - 0.57,
        side * 5.22
      );
      edgeGirder.castShadow = true;
      bridge.add(edgeGirder);
    }

    // ============================================================
    // 7. MAIN ARCH RIBS - PARABOLA + KEMIRINGAN 10°
    // ============================================================

    const archStations = [];
    const stationStep = 2;

    for (let x = ARCH_START; x <= ARCH_END + 0.001; x += stationStep) {
      archStations.push(Math.min(x, ARCH_END));
    }

    if (archStations[archStations.length - 1] !== ARCH_END) {
      archStations.push(ARCH_END);
    }

    for (const side of [-1, 1]) {
      for (let i = 0; i < archStations.length - 1; i++) {
        const p1 = archPoint(archStations[i], side);
        const p2 = archPoint(archStations[i + 1], side);

        addBeam(
          p1,
          p2,
          0.62,
          0.72,
          steelRed
        );
      }
    }

    // ============================================================
    // 8. HANGERS
    // ============================================================

    // Dibuat rapat seperti tampak samping pada gambar struktur.
    for (let x = -48; x <= 48; x += 6) {
      for (const side of [-1, 1]) {
        const top = archPoint(x, side);

        const bottom = new THREE.Vector3(
          x,
          DECK_Y + 0.32,
          side * 5.05
        );

        addCylinderBetween(
          bottom,
          top,
          0.075,
          hangerMat
        );
      }
    }

    // ============================================================
    // 9. TOP CROSS BRACING ANTAR ARCH
    // ============================================================

    // Bracing hanya ditempatkan di bagian yang cukup tinggi,
    // seperti pada model referensi.
    const topBraceStations = [-36, -28, -20, -12, -4, 4, 12, 20, 28, 36];

    for (const x of topBraceStations) {
      addBeam(
        archPoint(x, -1),
        archPoint(x, 1),
        0.28,
        0.28,
        steelRedDark
      );
    }

    // Pola diagonal zig-zag di antara kedua rib.
    for (let i = 0; i < topBraceStations.length - 1; i++) {
      const x1 = topBraceStations[i];
      const x2 = topBraceStations[i + 1];

      if (i % 2 === 0) {
        addBeam(
          archPoint(x1, -1),
          archPoint(x2, 1),
          0.22,
          0.22,
          steelRedDark
        );
      } else {
        addBeam(
          archPoint(x1, 1),
          archPoint(x2, -1),
          0.22,
          0.22,
          steelRedDark
        );
      }
    }

    // ============================================================
    // 10. FLOOR CROSS GIRDERS
    // ============================================================

    for (let x = -72.5; x <= 72.5; x += 5) {
      addBeam(
        new THREE.Vector3(x, DECK_Y - 0.72, -5.35),
        new THREE.Vector3(x, DECK_Y - 0.72, 5.35),
        0.34,
        0.38,
        steelRedDark
      );
    }

    // ============================================================
    // 11. SIDE TRUSS DI BAWAH DECK
    // ============================================================

    for (const side of [-1, 1]) {
      const z = side * 5.25;
      const topY = DECK_Y - 0.52;
      const bottomY = DECK_Y - 1.75;

      addBeam(
        new THREE.Vector3(-75, bottomY, z),
        new THREE.Vector3(75, bottomY, z),
        0.28,
        0.32,
        steelRed
      );

      for (let x = -75; x < 75; x += 5) {
        // Vertikal
        addBeam(
          new THREE.Vector3(x, topY, z),
          new THREE.Vector3(x, bottomY, z),
          0.22,
          0.22,
          steelRedDark
        );

        // Diagonal bergantian.
        const nextX = Math.min(x + 5, 75);
        const diagonalUp =
          (Math.floor((x + 75) / 5) % 2 === 0);

        if (diagonalUp) {
          addBeam(
            new THREE.Vector3(x, bottomY, z),
            new THREE.Vector3(nextX, topY, z),
            0.20,
            0.20,
            steelRedDark
          );
        } else {
          addBeam(
            new THREE.Vector3(x, topY, z),
            new THREE.Vector3(nextX, bottomY, z),
            0.20,
            0.20,
            steelRedDark
          );
        }
      }
    }

    // ============================================================
    // 12. UNDER-DECK V / TRIANGULAR BRACING DEKAT SPRINGING
    // ============================================================

    // Bentuk bawah jembatan pada referensi mempunyai elemen merah
    // turun di sekitar awal/akhir arch.
    for (const side of [-1, 1]) {
      const z = side * 5.0;

      // Kiri
      addBeam(
        new THREE.Vector3(-67, -0.7, z),
        new THREE.Vector3(-53, -6.4, z),
        0.40,
        0.44,
        steelRed
      );

      addBeam(
        new THREE.Vector3(-53, -6.4, z),
        new THREE.Vector3(-39, -0.7, z),
        0.40,
        0.44,
        steelRed
      );

      // Kanan
      addBeam(
        new THREE.Vector3(39, -0.7, z),
        new THREE.Vector3(53, -6.4, z),
        0.40,
        0.44,
        steelRed
      );

      addBeam(
        new THREE.Vector3(53, -6.4, z),
        new THREE.Vector3(67, -0.7, z),
        0.40,
        0.44,
        steelRed
      );
    }

    // ============================================================
    // 13. RAILING
    // ============================================================

    for (const side of [-1, 1]) {
      const z = side * 5.05;

      // Handrail memanjang
      addBeam(
        new THREE.Vector3(-75, 1.18, z),
        new THREE.Vector3(75, 1.18, z),
        0.12,
        0.12,
        railingMat
      );

      addBeam(
        new THREE.Vector3(-75, 0.70, z),
        new THREE.Vector3(75, 0.70, z),
        0.08,
        0.08,
        railingMat
      );

      // Tiang railing
      for (let x = -75; x <= 75; x += 3) {
        addCylinderBetween(
          new THREE.Vector3(x, 0.25, z),
          new THREE.Vector3(x, 1.18, z),
          0.035,
          railingMat
        );
      }
    }

    // ============================================================
    // 14. LAMPU JALAN
    // ============================================================

    function addLamp(x, side) {
      const z = side * 4.72;

      addCylinderBetween(
        new THREE.Vector3(x, 0.35, z),
        new THREE.Vector3(x, 3.1, z),
        0.055,
        lampMat
      );

      const armEnd = new THREE.Vector3(
        x,
        3.15,
        z - side * 0.72
      );

      addCylinderBetween(
        new THREE.Vector3(x, 3.08, z),
        armEnd,
        0.045,
        lampMat
      );

      const lampHead = new THREE.Mesh(
        new THREE.BoxGeometry(0.48, 0.12, 0.20),
        lampMat
      );

      lampHead.position.copy(armEnd);
      lampHead.position.z -= side * 0.15;
      lampHead.castShadow = true;
      bridge.add(lampHead);
    }

    for (let x = -67.5; x <= 67.5; x += 15) {
      addLamp(x, -1);
      addLamp(x + 7.5, 1);
    }

    // ============================================================
    // 15. ABUTMENT RINGAN
    // ============================================================

    for (const x of [-73, 73]) {
      const abutment = new THREE.Mesh(
        new THREE.BoxGeometry(5.0, 5.0, 11.5),
        concreteMat
      );

      abutment.position.set(x, -3.0, 0);
      abutment.castShadow = true;
      abutment.receiveShadow = true;
      bridge.add(abutment);
    }

    // ============================================================
    // 16. WATER + LAND
    // ============================================================

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(125, 155),
      waterMat
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, -7.15, 0);
    water.receiveShadow = true;
    scene.add(water);

    function addLand(x, width) {
      const land = new THREE.Mesh(
        new THREE.PlaneGeometry(width, 180),
        landMat
      );

      land.rotation.x = -Math.PI / 2;
      land.position.set(x, -6.95, 0);
      land.receiveShadow = true;
      scene.add(land);
    }

    addLand(-107, 90);
    addLand(107, 90);

    // Jalan pendek di daratan untuk membuat deck terasa menyatu dengan tapak.
    for (const x of [-105, 105]) {
      const approach = new THREE.Mesh(
        new THREE.BoxGeometry(60, 0.12, 8.5),
        asphaltMat
      );
      approach.position.set(x, 0.04, 0);
      approach.receiveShadow = true;
      scene.add(approach);

      const approachCenter = new THREE.Mesh(
        new THREE.BoxGeometry(59, 0.025, 0.10),
        yellowPaintMat
      );
      approachCenter.position.set(x, 0.115, 0);
      scene.add(approachCenter);
    }

    // Garis kontur sederhana di kedua bank agar nuansa tapak mendekati PDF.
    function addContourSet(side) {
      const baseX = side < 0 ? -138 : 138;

      for (let i = 0; i < 9; i++) {
        const x0 = baseX - side * i * 5.2;
        const points = [
          new THREE.Vector3(x0, -6.82 + i * 0.02, -80),
          new THREE.Vector3(x0 + side * 5, -6.82 + i * 0.02, -45),
          new THREE.Vector3(x0 + side * 10, -6.82 + i * 0.02, -15),
          new THREE.Vector3(x0 + side * 8, -6.82 + i * 0.02, 20),
          new THREE.Vector3(x0 + side * 2, -6.82 + i * 0.02, 55),
          new THREE.Vector3(x0, -6.82 + i * 0.02, 80)
        ];

        const geo = new THREE.BufferGeometry().setFromPoints(points);
        scene.add(new THREE.Line(geo, contourMat));
      }
    }

    addContourSet(-1);
    addContourSet(1);

    // ============================================================
    // 17. ANIMATION
    // ============================================================

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
